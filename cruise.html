                                        </div>
                                        
                                        <div className="flex gap-8">
                                            <div className="shrink-0 w-14 h-14 bg-neutral-50 rounded-full flex items-center justify-center border border-neutral-100">
                                                <Icons.Hotel />
                                            </div>
                                            <div>
                                                <h5 className="text-[10px] font-bold tracking-[0.3em] uppercase text-neutral-400 mb-2">Post-Cruise Residency</h5>
                                                <p className="text-2xl font-serif text-neutral-800">{selectedPackage.postHotel}</p>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* Action button wired up with handleTripAction */}
                                    <button 
                                        onClick={(e) => handleTripAction(e, selectedPackage)}
                                        className="w-full bg-black text-white py-7 text-[10px] font-bold tracking-[0.5em] uppercase hover:bg-blue-900 transition-all duration-700"
                                    >
                                        Request Private Consultation
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
