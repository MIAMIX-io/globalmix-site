---
layout: default
---
<section class="section light-bg">
    <div class="container">
        <article>
            {% if page.image %}
            <div class="post-cover" style="margin-bottom: 30px;">
                <img src="{{ page.image }}" alt="{{ page.title }}" style="width: 100%; border-radius: 8px;">
            </div>
            {% endif %}

            <h1>{{ page.title }}</h1>
            <p class="subtitle">{{ page.date | date: "%B %d, %Y" }} | By {{ page.author }}</p>
            
            <div class="content">
                {{ content }}
            </div>
        </article>
    </div>
</section>
