<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Mix Euro-Asia & Middle East | Elite Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        gold: '#C2A378',
                        dark: '#1A1A1A',
                    },
                    animation: {
                        'fade-in': 'fadeIn 2s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .circuit-card:hover .circuit-image {
            transform: scale(1.08);
        }
    </style>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-white text-gray-900 antialiased">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        import { 
            Compass, MapPin, Globe, Mail, Phone, ChevronRight, Menu, X, ChevronDown, MessageCircle
        } from 'https://esm.sh/lucide-react@0.292.0';

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            const contactData = {
                phone: "+1 786 459 8797",
                whatsapp: "17864598797",
                email: "info@globalmix.online"
            };

            const euroAsiaJourneys = [
                { id: 1, title: "Ottoman & Arabian Legacy", duration: "10 Days", tag: "Turkey & UAE", route: "Istanbul – Cappadocia – Dubai – Abu Dhabi", description: "Heritage meets ultra-modern luxury in the cradle of civilization.", hotels: ["Çırağan Palace Kempinski Istanbul", "Burj Al Arab Jumeirah, Dubai", "Emirates Palace Mandarin Oriental"], image: "https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?auto=format&fit=crop&q=80&w=800" },
                { id: 2, title: "Russia Imperial & Dubai", duration: "10–12 Days", tag: "Imperial Grandeur", route: "Moscow – Saint Petersburg – Dubai", description: "Imperial history meets desert extravagance across two vast cultures.", hotels: ["Four Seasons Hotel Moscow", "Belmond Grand Hotel Europe", "Atlantis The Royal Dubai"], image: "https://images.unsplash.com/photo-1513326738677-b964603b136d?auto=format&fit=crop&q=80&w=800" },
                { id: 3, title: "Silk Road Luxury Journey", duration: "12 Days", tag: "Caucasus Gateway", route: "Istanbul – Tbilisi – Baku – Dubai", description: "A modern twist on the historic trade route connecting the East and West.", hotels: ["Stamba Hotel Tbilisi", "Four Seasons Hotel Baku", "Armani Hotel Dubai"], image: "https://images.unsplash.com/photo-1565011523534-747a8601f10a?auto=format&fit=crop&q=80&w=800" },
                { id: 4, title: "Arabian Peninsula Ultra Luxury", duration: "10 Days", tag: "Gulf Collection", route: "Dubai – Abu Dhabi – Doha – Muscat", description: "The ultimate high-end Middle East experience in the rising Gulf capitals.", hotels: ["One&Only One Za’abeel", "Raffles Doha", "Al Bustan Palace Muscat"], image: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&q=80&w=800" },
                { id: 5, title: "Grand Turkey Luxury", duration: "10 Days", tag: "Ottoman Signature", route: "Istanbul – Cappadocia – Izmir – Bodrum", description: "Ottoman heritage and Aegean yachting in the Mediterranean's most storied coast.", hotels: ["The Peninsula Istanbul", "Argos in Cappadocia", "Mandarin Oriental Bodrum"], image: "https://images.unsplash.com/photo-1605333396915-47ed6b68a00e?auto=format&fit=crop&q=80&w=800" },
                { id: 6, title: "Russia & Black Sea Riviera", duration: "10 Days", tag: "Riviera Routes", route: "Moscow – Sochi – Istanbul", description: "A journey through high-latitude nature, coastal luxury, and deep culture.", hotels: ["The Ritz-Carlton Moscow", "Rodina Grand Hotel Sochi", "Raffles Istanbul"], image: "https://images.unsplash.com/photo-1549468057-5b7fa1a41d7a?auto=format&fit=crop&q=80&w=800" },
                { id: 7, title: "Luxury Levant & Gulf Escape", duration: "9 Days", tag: "History & Wellness", route: "Dubai – Amman – Petra – Dead Sea", description: "Private archaeological visits and world-class spa luxury in Jordan and the UAE.", hotels: ["Bulgari Resort Dubai", "The St. Regis Amman", "Ishtar Dead Sea Kempinski"], image: "https://images.unsplash.com/photo-1542284759-c48463e30f48?auto=format&fit=crop&q=80&w=800" },
                { id: 8, title: "Caucasus Hidden Luxury", duration: "9 Days", tag: "Hidden Gems", route: "Tbilisi – Yerevan – Baku", description: "Explore the emerging high-end cultural gems of the mountainous Caucasus.", hotels: ["Rooms Hotel Tbilisi", "The Alexander Yerevan", "Fairmont Baku Flame Towers"], image: "https://images.unsplash.com/photo-1549468057-5b7fa1a41d7a?auto=format&fit=crop&q=80&w=800" },
                { id: 9, title: "Dubai & Maldives Escape", duration: "9–10 Days", tag: "Iconic Duo", route: "Dubai – Maldives", description: "The top-selling combination of metropolitan luxury and overwater bliss.", hotels: ["Atlantis The Royal Dubai", "Soneva Fushi Maldives", "St. Regis Maldives Vommuli"], image: "https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&q=80&w=800" }
            ];

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const handleTripAction = (e, trip) => {
                e.preventDefault();
                const subject = encodeURIComponent(`Requesting Full Itinerary: ${trip.title}`);
                const body = encodeURIComponent(`Hello Global Mix VIP Team,\n\nPlease send me the full itinerary and details for the "${trip.title}" Euro-Asia expedition.\n\nThank you!`);
                window.location.href = `mailto:${contactData.email}?subject=${subject}&body=${body}`;
            };

            const handleFormSubmit = (e) => {
                e.preventDefault();
                const destination = e.target.destination.value;
                const subject = encodeURIComponent(`Availability Request: ${destination}`);
                const body = encodeURIComponent(`Hello Global Mix VIP Team,\n\nI am interested in the ${destination} itinerary. Please contact me with availability and rates.\n\nThank you!`);
                window.location.href = `mailto:${contactData.email}?subject=${subject}&body=${body}`;
            };

            return (
                <div className="min-h-screen bg-white text-gray-900 font-sans selection:bg-gold/20">
                    
                    {/* WhatsApp Floating Button */}
                    <a href={`https://wa.me/${contactData.whatsapp}`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-[60] bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center gap-2 group">
                        <span className="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-500 whitespace-nowrap text-sm font-sans font-bold uppercase tracking-widest pl-0 group-hover:pl-2">Contact VIP</span>
                        <MessageCircle size={24} />
                    </a>

                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 transition-all duration-700 ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-sm py-3' : 'bg-transparent py-6'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className={`w-10 h-10 dark flex items-center justify-center rounded-sm transition-colors ${scrolled ? 'bg-dark' : 'bg-white'}`}>
                                    <span className={`font-serif font-bold text-xl ${scrolled ? 'text-white' : 'text-dark'}`}>G</span>
                                </div>
                                <div className="flex flex-col text-dark">
                                    <span className={`font-bold tracking-[0.2em] text-sm uppercase ${scrolled ? 'text-dark' : 'text-white'}`}>Global Mix</span>
                                    <span className={`text-[9px] tracking-[0.3em] font-semibold uppercase ${scrolled ? 'text-gold' : 'text-gold'}`}>Euro-Asia &amp; Middle East</span>
                                </div>
                            </div>

                            <nav className={`hidden md:flex gap-10 text-[10px] font-bold uppercase tracking-[0.2em] ${scrolled ? 'text-gray-600' : 'text-white/90'}`}>
                                <a href="#" className="hover:text-gold transition-colors">Home</a>
                                <a href="#circuits" className="hover:text-gold transition-colors">Itineraries</a>
                                <a href="#vision" className="hover:text-gold transition-colors">Vision</a>
                                <a href="#contact" className="hover:text-gold transition-colors">Concierge</a>
                            </nav>

                            <div className="flex items-center gap-4">
                                <button className="md:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                    {isMenuOpen ? <X className={scrolled ? 'text-dark' : 'text-white'} /> : <Menu className={scrolled ? 'text-dark' : 'text-white'} />}
                                </button>
                                <a href={`https://wa.me/${contactData.whatsapp}`} className={`hidden md:inline-block px-8 py-3 text-[10px] font-bold uppercase tracking-widest hover:bg-gold transition-all duration-500 rounded-sm ${scrolled ? 'bg-dark text-white' : 'bg-white text-dark'}`}>
                                    Inquire Now
                                </a>
                            </div>
                        </div>

                        {/* Mobile Menu */}
                        {isMenuOpen && (
                            <div className="absolute top-full left-0 w-full bg-white shadow-xl md:hidden flex flex-col p-8 gap-6 animate-in slide-in-from-top duration-300 border-t border-gray-100">
                                <a href="#circuits" onClick={() => setIsMenuOpen(false)} className="text-sm font-bold text-dark tracking-widest uppercase hover:text-gold">Itineraries</a>
                                <a href="#vision" onClick={() => setIsMenuOpen(false)} className="text-sm font-bold text-dark tracking-widest uppercase hover:text-gold">Vision</a>
                                <a href="#contact" onClick={() => setIsMenuOpen(false)} className="text-sm font-bold text-dark tracking-widest uppercase hover:text-gold">Contact</a>
                                <a href={`mailto:${contactData.email}`} className="bg-dark text-white py-4 font-bold text-center uppercase tracking-widest text-xs">Request Concierge</a>
                            </div>
                        )}
                    </nav>

                    {/* Hero Section */}
                    <section className="relative h-screen flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img src={"https://images.unsplash.com/photo-1541336032412-2048a678540d?auto=format&fit=crop&q=80&w=2000&fm=webp"} alt="Bosphorus Istanbul View" className="w-full h-full object-cover scale-105" fetchPriority="high" />
                            <div className="absolute inset-0 bg-black/40"></div>
                        </div>

                        <div className="relative z-10 text-center px-6 max-w-6xl animate-fade-in">
                            <h2 className="text-white text-[11px] md:text-xs uppercase tracking-[0.7em] mb-8 opacity-80 font-semibold">Bridging Worlds</h2>
                            <h1 className="text-white text-5xl md:text-9xl font-serif mb-10 leading-tight drop-shadow-xl">Euro-Asia <br/><span className="italic">&amp; Middle East</span></h1>
                            <p className="text-white/90 max-w-3xl mx-auto font-light text-lg md:text-2xl leading-relaxed italic">
                                "From Imperial grandeur to modern extravagance. A curated selection of 9 ultra-premium journeys."
                            </p>
                            <div className="mt-16">
                                <a href="#circuits" className="inline-block border border-white text-white px-16 py-6 text-[10px] font-bold uppercase tracking-[0.4em] hover:bg-white hover:text-dark transition-all duration-700">
                                    Explore Collection
                                </a>
                            </div>
                        </div>
                        
                        <div className="absolute bottom-12 left-1/2 -translate-x-1/2 flex flex-col items-center gap-4 text-white/40">
                            <span className="text-[9px] uppercase tracking-[0.4em]">Scroll</span>
                            <ChevronDown size={24} className="animate-bounce" />
                        </div>
                    </section>

                    {/* Vision Section */}
                    <section id="vision" className="py-40 px-6 max-w-5xl mx-auto text-center">
                        <span className="text-gold uppercase tracking-[0.5em] text-[10px] font-bold italic block mb-6">The Pinnacle of Travel</span>
                        <h2 className="text-4xl md:text-6xl font-serif mb-12 text-dark">Where Heritage Meets Future</h2>
                        <p className="text-gray-500 text-xl leading-relaxed font-light max-w-3xl mx-auto">
                            Our Euro-Asia and Middle East collection captures the essence of the new Silk Road. We bring together the imperial echoes of Istanbul and St. Petersburg with the soaring skylines of Dubai and Baku, creating an unparalleled narrative for the high-end traveler.
                        </p>
                    </section>

                    {/* Circuits Grid */}
                    <section id="circuits" className="py-24 bg-gray-50 scroll-mt-20">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-20 gap-8">
                                <div>
                                    <span className="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold">The Elite Selection</span>
                                    <h3 className="text-5xl font-serif mt-3 text-dark leading-none">Ultra-Premium Circuits</h3>
                                    <div className="h-1 w-24 bg-gold mt-8"></div>
                                </div>
                                <p className="text-gray-400 text-[10px] max-w-xs uppercase tracking-[0.2em] font-semibold italic md:text-right">Turkey, Russia &amp; The Arabian Peninsula</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                                {euroAsiaJourneys.map((journey) => (
                                    <div key={journey.id} className="circuit-card group bg-white shadow-sm hover:shadow-2xl transition-all duration-700 overflow-hidden flex flex-col border border-gray-100">
                                        <div className="h-80 overflow-hidden relative">
                                            <img src={`${journey.image}&fm=webp&q=70&w=800`} alt={journey.title} className="circuit-image w-full h-full object-cover transition-transform duration-1000" loading="lazy" />
                                            <div className="absolute top-5 right-5 bg-white/95 px-4 py-1.5 text-[9px] font-bold uppercase tracking-widest text-dark shadow-sm">{journey.duration}</div>
                                        </div>
                                        <div className="p-10 flex flex-col flex-grow">
                                            <span className="text-[9px] text-gold font-bold uppercase tracking-[0.3em]">{journey.tag}</span>
                                            <h4 className="text-2xl font-serif mt-3 mb-5 text-dark leading-tight">{journey.title}</h4>
                                            <p className="text-gray-500 text-sm mb-8 font-light leading-relaxed flex-grow">{journey.route}. {journey.description}</p>
                                            
                                            <div className="border-t border-gray-100 pt-6">
                                                <p className="text-[9px] uppercase font-bold tracking-[0.2em] text-gray-400 mb-4">Signature Hotels</p>
                                                <ul className="text-[11px] space-y-3 text-gray-700 font-medium italic mb-8">
                                                    {journey.hotels.map((hotel, idx) => (
                                                        <li key={idx} className="flex items-start gap-2">
                                                            <span className="text-gold">•</span> {hotel}
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>

                                            <button 
                                                onClick={(e) => handleTripAction(e, journey)}
                                                className="w-full border border-dark text-dark py-4 text-[9px] font-bold uppercase tracking-[0.3em] hover:bg-dark hover:text-white transition-all duration-500 flex justify-center items-center gap-2"
                                            >
                                                Request Itinerary <ChevronRight size={14} />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Quote Section */}
                    <section className="py-48 relative text-center text-white overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img src={"https://images.unsplash.com/photo-1489493512598-d08130f49bea?auto=format&fit=crop&q=80&w=2000&fm=webp"} alt="Desert Luxury" className="w-full h-full object-cover" loading="lazy" />
                            <div className="absolute inset-0 bg-black/50"></div>
                        </div>
                        <div className="relative z-10 max-w-4xl mx-auto px-6">
                            <h3 className="text-4xl md:text-7xl font-serif italic mb-8 leading-tight drop-shadow-lg">"Experience the echoes of empires and the pulse of the future."</h3>
                            <p className="text-[10px] uppercase tracking-[0.5em] font-bold text-gold">Global Mix Euro-Asia &amp; Middle East</p>
                        </div>
                    </section>

                    {/* Contact Section */}
                    <section id="contact" className="py-32 px-6 bg-white border-t border-gray-100">
                        <div className="max-w-7xl mx-auto flex flex-col lg:flex-row gap-24">
                            <div className="lg:w-1/2">
                                <span className="text-gold uppercase tracking-[0.4em] text-[10px] font-bold">Inquiry &amp; Concierge</span>
                                <h2 className="text-5xl font-serif mt-6 mb-10 text-dark">The Journey Begins Here</h2>
                                <p className="text-gray-500 mb-16 max-w-md text-lg font-light leading-relaxed">Our regional specialists coordinate every aspect of your itinerary, from private Kremlin access to desert sky-towers.</p>

                                <div className="space-y-10">
                                    <div className="flex items-center gap-8 group cursor-pointer" onClick={() => window.open(`https://wa.me/${contactData.whatsapp}`)}>
                                        <div className="w-14 h-14 bg-dark text-white flex items-center justify-center group-hover:bg-gold transition-all duration-500 rounded-sm">
                                            <Phone size={20} />
                                        </div>
                                        <div>
                                            <p className="text-[9px] uppercase font-bold text-gray-400 tracking-[0.2em]">Phone &amp; WhatsApp</p>
                                            <p className="text-2xl font-serif text-dark">{contactData.phone}</p>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-8 group cursor-pointer" onClick={() => window.location.href = `mailto:${contactData.email}`}>
                                        <div className="w-14 h-14 bg-dark text-white flex items-center justify-center group-hover:bg-gold transition-all duration-500 rounded-sm">
                                            <Mail size={20} />
                                        </div>
                                        <div>
                                            <p className="text-[9px] uppercase font-bold text-gray-400 tracking-[0.2em]">Email Address</p>
                                            <p className="text-2xl font-serif text-dark">{contactData.email}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="lg:w-1/2 bg-gray-50 p-12 lg:p-16 rounded-xl border border-gray-100">
                                <form onSubmit={handleFormSubmit} className="space-y-8">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div className="space-y-3">
                                            <label className="text-[9px] uppercase font-bold tracking-[0.2em] text-gray-400">Guest Name</label>
                                            <input name="name" type="text" required className="w-full bg-white border border-gray-200 p-4 focus:border-gold outline-none transition-all font-light text-sm" />
                                        </div>
                                        <div className="space-y-3">
                                            <label className="text-[9px] uppercase font-bold tracking-[0.2em] text-gray-400">Email Address</label>
                                            <input name="email" type="email" required className="w-full bg-white border border-gray-200 p-4 focus:border-gold outline-none transition-all font-light text-sm" />
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <label className="text-[9px] uppercase font-bold tracking-[0.2em] text-gray-400">Destination of Interest</label>
                                        <select name="destination" className="w-full bg-white border border-gray-200 p-4 focus:border-gold outline-none transition-all font-light text-sm cursor-pointer appearance-none">
                                            {euroAsiaJourneys.map(j => <option key={j.id}>{j.title}</option>)}
                                        </select>
                                    </div>
                                    <div className="space-y-3">
                                        <label className="text-[9px] uppercase font-bold tracking-[0.2em] text-gray-400">Preferences / Special Requirements</label>
                                        <textarea rows="4" className="w-full bg-white border border-gray-200 p-4 focus:border-gold outline-none transition-all font-light text-sm"></textarea>
                                    </div>
                                    <button type="submit" className="w-full bg-dark text-white py-5 text-[10px] font-bold uppercase tracking-[0.3em] hover:bg-gold transition-all duration-500 shadow-lg">
                                        Request Availability
                                    </button>
                                </form>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-dark text-white py-20 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 border border-white/20 flex items-center justify-center rounded-sm">
                                    <span className="font-serif font-bold text-2xl">G</span>
                                </div>
                                <div className="flex flex-col">
                                    <span className="font-bold tracking-[0.3em] uppercase text-sm">Global Mix</span>
                                    <span className="text-[10px] tracking-[0.4em] gold-accent uppercase font-bold">Euro-Asia</span>
                                </div>
                            </div>

                            <div className="flex flex-wrap justify-center gap-8 text-[9px] uppercase tracking-[0.3em] text-gray-400 font-bold">
                                <a href="europe.html" className="hover:text-gold transition-colors">Europe</a>
                                <a href="asia.html" className="hover:text-gold transition-colors">Asia</a>
                                <a href="africa.html" className="hover:text-gold transition-colors">Africa</a>
                                <a href="caribe.html" className="hover:text-gold transition-colors">Caribe</a>
                                <a href="trains.html" className="hover:text-gold transition-colors">Luxury Train</a>
                                <a href="#" className="text-white">Euro-Asia</a>
                            </div>

                            <div className="text-[9px] text-gray-400 uppercase tracking-[0.2em] font-medium opacity-50">
                                © 2025 Global Mix Network. All Rights Reserved.
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
