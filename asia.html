<!DOCTYPE html>

    <title>Global Mix - Travel Asia | Elite Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],

    <style>

<body class="bg-[#FDFBF7] antialiased">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">

        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        import {
            Compass, MapPin, Ship, Building, Menu, X, ChevronRight, 
            Mail, Phone, Globe, Bed, Star, ChevronDown, MessageCircle, Sparkles, Map
        } from 'https://esm.sh/lucide-react@0.292.0';

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [activeCategory, setActiveCategory] = useState('All');

            const contactData = {
                phone: "+1 786 459 8797",
                whatsapp: "17864598797",
                email: "info@globalmix.online"
            };

            const navLinks = [
                { name: 'Itineraries', href: '#itineraries' },
                { name: 'Philosophy', href: '#about' },
                { name: 'Concierge', href: '#concierge' }
            ];

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // 1. ACTION FOR THE BUTTON (Opens Email Draft)

                e.preventDefault();
                e.stopPropagation(); 
                const subject = encodeURIComponent(`Requesting Full Itinerary: ${trip.title}`);
                const body = encodeURIComponent(`Hello Global Mix VIP Team,\n\nPlease send me the full itinerary and details for the "${trip.title}" Asia expedition.\n\nThank you!`);
                window.location.href = `mailto:${contactData.email}?subject=${subject}&body=${body}`;
            };

            const handleImageClick = (e, trip) => {
                e.preventDefault();
                if (trip.slug) {
                    window.location.href = `https://${trip.slug}`;
                } else {
                    const safeSlug = trip.title.toLowerCase().replace(/[^a-z0-9]+/g, '-'); 
                    window.location.href = `/travel/asia/${safeSlug}`;
                }
            };

            const asiaJourneys = [
    { id: 1, title: "Imperial & Modern Japan", duration: "9–10 Days", countries: "Japan", slug: "globalmix.network/travel/asia/japan-as-01", route: "Tokyo → Hakone → Kyoto", experiences: ["Private dinner with a Geisha", "Traditional Ryokan with private Onsen", "First-class Shinkansen travel"], hotels: ["Aman Tokyo", "The Ritz-Carlton Kyoto"], image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&q=80&w=1200&fm=webp", category: "East Asia" },

                                Exploration • Heritage • Luxury
                            </span>
                            <h1 className="text-6xl md:text-9xl font-serif text-white mb-8 leading-[0.85]">
                                Grand Journeys <br />
                                <span className="italic text-gold drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">
                                    of Asia
                                </span>
                            </h1>
                            <p className="text-lg md:text-xl text-white/90 max-w-2xl mx-auto leading-relaxed mb-10 font-light italic">
                                "A masterwork collection of journeys where thousand-year-old traditions meet the sophisticated pulse of the future."

                            <div className="flex justify-center">
                                <a href="#itineraries" className="bg-white text-imperial px-16 py-6 text-[10px] font-bold tracking-[0.5em] uppercase hover:bg-gold hover:text-white transition-all duration-700 shadow-xl">
                                    Explore Collection

                            </div>

                            <h2 className="text-xs font-bold tracking-[0.5em] text-gold uppercase mb-10">The Zen of Travel</h2>
                            <p className="text-3xl md:text-5xl font-serif italic text-imperial leading-tight mb-12">
                                "We bridge the gap between ancient spirits and modern luxuries, crafting narratives that resonate deep within the soul."
                            </p>
                            <div className="w-20 h-px bg-gold mx-auto"></div>
                        </div>
                    </section>

                    {/* Circuits Grid */}
                    <section id="itineraries" className="py-32 px-6 bg-[#fdfdfd] scroll-mt-20">
                        <div className="max-w-7xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-20 gap-8">
                                <div>
                                    <span className="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold">Signature Masterlist</span>
                                    <h3 className="text-5xl font-serif mt-3 text-imperial leading-none">Asia Collection</h3>
                                    <div className="h-1 w-24 bg-gold mt-8"></div>
                                </div>
                                <div className="flex gap-3 overflow-x-auto pb-2 w-full md:w-auto scrollbar-hide">

                                        <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-6 py-2 text-[9px] font-bold tracking-widest uppercase transition-all border ${activeCategory === cat ? 'bg-imperial text-white border-imperial shadow-lg' : 'bg-transparent text-gray-400 border-gray-300 hover:border-gold hover:text-gold'}`}>
                                            {cat}

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">

                                    <div key={journey.id} className="group bg-white shadow-sm hover:shadow-2xl transition-all duration-700 overflow-hidden flex flex-col border border-gray-100 rounded-2xl">
                                        
                                        {/* IMAGE ACTION: Links to the Generated Notion Slug */}
                                        <a href={journey.slug ? `https://${journey.slug}` : `#`} onClick={(e) => handleImageClick(e, journey)} className="h-80 overflow-hidden relative block cursor-pointer">
                                            <img src={journey.image} alt={journey.title} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110 grayscale-[10%] group-hover:grayscale-0" loading="lazy" />
                                            <div className="absolute top-5 right-5 bg-white/95 px-4 py-1.5 text-[9px] font-bold uppercase tracking-widest text-imperial rounded-full shadow-sm">{journey.duration}</div>
                                        </a>

                                        <div className="p-10 flex flex-col flex-grow">
                                            <div className="flex items-center gap-2 text-gold mb-4 font-bold text-[10px] tracking-widest uppercase"><Map size={14} /> Premium Circuit</div>
                                            <h4 className="text-2xl font-serif mb-4 text-imperial leading-tight group-hover:text-gold transition-colors">{journey.title}</h4>
                                            
                                            <div className="mb-6 border-l-2 border-gold/30 pl-4 flex-grow">

                                                <p className="text-sm text-gray-600 italic font-medium">{journey.route}</p>
                                            </div>

                                                <div className="flex flex-wrap gap-2 mb-8">

                                            {/* BUTTON ACTION: Opens Mail Draft */}
                                            <button

                                                className="mt-auto w-full border border-imperial text-imperial py-4 text-[9px] font-bold uppercase tracking-[0.3em] hover:bg-imperial hover:text-white transition-all duration-500 flex justify-center items-center gap-2 rounded-lg"

                                        alt="Asia Concierge" 
                                        loading="lazy" 
                                    />
                                </div>
                                <div className="absolute -bottom-10 -right-10 bg-gold p-12 hidden md:block rounded-sm shadow-2xl transform hover:-translate-y-2 transition-transform duration-500">
                                    <p className="text-4xl italic leading-tight text-imperial font-serif">
                                        Private <br />Concierge <br />In Asia
                                    </p>
                                </div>
                            </div>

                            <div>
                                <h3 className="text-xs font-bold tracking-[0.5em] text-gold uppercase mb-8">
                                    UNPARALLELED ACCESS
                                </h3>
                                <h4 className="text-5xl md:text-6xl mb-10 leading-none font-serif text-white">
                                    The Silk Road <br/>

                                <div className="space-y-12">
