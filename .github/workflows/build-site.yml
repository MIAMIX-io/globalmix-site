name: Generate Dynamic Trip Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour

# Explicitly grant the action permission to push code back to the repo
permissions:
  contents: write 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Upgraded to v4 to fix the Node deprecation warning
      - name: Checkout Code
        uses: actions/checkout@v4 

      # Upgraded to v4 and Node 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Fetch Notion Data & Generate Pages
        env:
          GLOBALMIX_NOTION_API_KEY: ${{ secrets.GLOBALMIX_NOTION_API_KEY }}
          GLOBALMIX_NOTION_DB_ID: ${{ secrets.GLOBALMIX_NOTION_DB_ID }}
        run: node build.js

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # Smarter Git check: only commit and push IF there are actual changes
          if git diff-index --quiet HEAD --; then
            echo "No new trips or updates found. Skipping commit."
          else
            git commit -m "Auto-generated trips from Global Mix Notion Database"
            git push
          fi
