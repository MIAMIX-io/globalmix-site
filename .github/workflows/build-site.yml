name: Generate Dynamic Trip Pages

on:
  push:
    branches:
      - main  # Runs whenever you push new data
  workflow_dispatch: # Allows you to run it manually via a button on GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate Trip Pages
        run: node build.js

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generated trip pages from database" || echo "No changes to commit"
          git push
