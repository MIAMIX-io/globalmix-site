name: Build Global Mix Site

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes
  workflow_dispatch:  # Allows you to click "Run workflow" manually in GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install @notionhq/client
      
      - name: Sync Notion pages & Build HTML
        env:
          GLOBALMIX_NOTION_API_KEY: ${{ secrets.NOTION_TOKEN }} 
          GLOBALMIX_NOTION_DB_ID: ${{ secrets.NOTION_DATABASE_ID }} 
        run: node build.js
      
      - name: Commit changes
        run: |
          git config user.name "Notion Sync Bot"
          git config user.email "bot@globalmix.online"
          git add .
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Auto-build from Notion $(date +'%Y-%m-%d %H:%M')"
          git push
