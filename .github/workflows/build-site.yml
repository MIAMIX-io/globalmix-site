name: Generate Dynamic Trip Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour

# Explicitly grant the action permission to push code back to the repo
permissions:
  contents: write 

# Silence the GitHub deprecation warning by forcing Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Upgraded to match GitHub's new standard

      - name: Install Dependencies
        run: npm install

      - name: Fetch Notion Data & Generate Pages
        env:
          GLOBALMIX_NOTION_API_KEY: ${{ secrets.GLOBALMIX_NOTION_API_KEY }}
          GLOBALMIX_NOTION_DB_ID: ${{ secrets.GLOBALMIX_NOTION_DB_ID }}
        run: node build.js

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # Foolproof check for any changes (including brand new folders)
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-generated trips from Global Mix Notion Database"
            git push
          else
            echo "No new trips or updates found. Skipping commit."
          fi
