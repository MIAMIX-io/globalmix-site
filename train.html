<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Mix Luxury Train | Elite Rail Collection</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        gold: '#D4AF37',
                        navy: '#0A1128',
                    },
                    animation: {
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'bounce': 'bounce 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #0A1128; }

        .train-card:hover .train-image {
            transform: scale(1.1);
        }
    </style>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-white text-gray-900 antialiased">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        import { 
            Compass, MapPin, Train, Utensils, Star, 
            Menu, X, ChevronRight, ChevronDown, Mail, Phone, Globe, MessageCircle, Building, Ship
        } from 'https://esm.sh/lucide-react@0.292.0';

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [activeCategory, setActiveCategory] = useState('All');
            const [selectedJourney, setSelectedJourney] = useState(null);

            const contactData = {
                phone: "+1 786 459 8797",
                whatsapp: "17864598797",
                email: "info@globalmix.online"
            };

            const trainJourneys = [
                { id: 1, title: "Peru Andean Luxury", duration: "6–7 Days", region: "Americas", train: "Hiram Bingham & Andean Explorer", description: "Navigate the high-altitude peaks of the Andes. A journey connecting the historic soul of Cusco with the mystical beauty of Machu Picchu and Lake Titicaca.", hotels: ["Belmond Palacio Nazarenas", "Cirqa Relais & Châteaux"], image: "https://images.unsplash.com/photo-1526392060635-9d6019884377?auto=format&fit=crop&q=80&w=800", category: "Americas" },
                { id: 2, title: "Venice Simplon-Orient-Express", duration: "5–6 Days", region: "Europe", train: "VSOE: London – Paris – Venice", description: "The world's most storied train. Experience the golden age of travel with Art Deco suites, midnight suppers, and white-glove service across Europe.", hotels: ["The Savoy London", "Aman Venice"], image: "https://images.unsplash.com/photo-1508260212562-273d64a8a7e1?q=80&w=770&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", category: "Europe" },
                { id: 3, title: "Royal Scotsman Highland", duration: "5 Days", region: "Europe", train: "Belmond Royal Scotsman", description: "Emerald peaks and deep lochs. Enjoy exclusive whisky tastings and private castle visits through the heart of the Scottish Highlands.", hotels: ["The Balmoral Edinburgh", "Gleneagles Hotel"], image: "https://images.unsplash.com/photo-1496252701692-db7eae2a86a6?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", category: "Europe" },
                { id: 4, title: "Maharajas’ Express India", duration: "7–8 Days", region: "Asia", train: "The Maharajas' Express", description: "A royal immersion into the 'Heritage of India'. Experience private Taj Mahal access and live like royalty in the most expensive train in Asia.", hotels: ["The Oberoi New Delhi", "The Taj Mahal Palace Mumbai"], image: "https://images.unsplash.com/photo-1670158575260-5bd84b303166?q=80&w=874&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", category: "Asia" },
                { id: 5, title: "Rocky Mountaineer Signature", duration: "6–7 Days", region: "Americas", train: "Rocky Mountaineer: GoldLeaf Service", description: "Unparalleled views of the Canadian Rockies through glass-dome coaches, pairing world-class peaks with iconic lakeside retreats.", hotels: ["Fairmont Pacific Rim", "Fairmont Banff Springs"], image: "https://images.unsplash.com/photo-1567139062703-c16c597e7530?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", category: "Americas" },
                { id: 6, title: "Rovos Rail Pride of Africa", duration: "6 Days", region: "Africa", train: "Rovos Rail: Pretoria to Cape Town", description: "The most luxurious train in the world. Features safari extensions and vineyard tours in meticulously restored vintage wood-paneled coaches.", hotels: ["Castello di Monte", "One&Only Cape Town"], image: "https://images.unsplash.com/photo-1484318571209-661cf29a69c3?auto=format&fit=crop&q=80&w=800", category: "Africa" },
                { id: 7, title: "The Blue Train South Africa", duration: "5 Days", region: "Africa", train: "The Blue Train: A Window to the Soul", description: "A magnificent moving five-star hotel. Panoramic suites and 24-hour butler service through the breathtaking South African interior.", hotels: ["Saxon Hotel Johannesburg", "The Silo Hotel Cape Town"], image: "https://plus.unsplash.com/premium_photo-1755564113759-f74f262a11cf?q=80&w=1548&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", category: "Africa" },
                { id: 8, title: "Seven Stars in Kyushu", duration: "5–6 Days", region: "Asia", train: "Seven Stars in Kyushu (Cruise Train)", description: "The pinnacle of Japanese hospitality. Fusing traditional craftsmanship with modern luxury, including Kaiseki dining and private onsen visits.", hotels: ["The Ritz-Carlton Fukuoka", "Amanemu"], image: "https://images.unsplash.com/photo-1761662826265-a3128501706a?q=80&w=826&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", category: "Asia" },
                { id: 9, title: "El Transcantábrico Gran Lujo", duration: "8 Days", region: "Europe", train: "El Transcantábrico: Northern Spain", description: "A five-star hotel on rails exploring Green Spain. Michelin-level gastronomy and heritage carriages traveling from San Sebastián to Santiago.", hotels: ["Hotel Maria Cristina", "Parador Hostal dos Reis"], image: "https://images.unsplash.com/photo-1690446631359-d6ba0d5e8877?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", category: "Europe" }
            ];

            const categories = ["All", "Europe", "Asia", "Africa", "Americas"];

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const handleTripAction = (e, trip) => {
                e.preventDefault();
                const subject = encodeURIComponent(`Requesting Rail Itinerary: ${trip.title}`);
                const body = encodeURIComponent(`Hello Global Mix VIP Team,\n\nPlease send me availability and details for the "${trip.title}" journey on the ${trip.train}.\n\nThank you!`);
                window.location.href = `mailto:${contactData.email}?subject=${subject}&body=${body}`;
            };

            const handleFormSubmit = (e) => {
                e.preventDefault();
                const rail = e.target.rail.value;
                const subject = encodeURIComponent(`Inquiry: ${rail}`);
                const body = encodeURIComponent(`Hello Global Mix VIP Team,\n\nI am interested in the ${rail}. Please contact me with availability.\n\nThank you!`);
                window.location.href = `mailto:${contactData.email}?subject=${subject}&body=${body}`;
            };

            return (
                <div className="min-h-screen bg-white text-gray-900 font-sans selection:bg-gold/20">
                    
                    {/* WhatsApp Floating Button */}
                    <a href={`https://wa.me/${contactData.whatsapp}`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-[60] bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center gap-2 group">
                        <span className="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-500 whitespace-nowrap text-sm font-sans font-bold uppercase tracking-widest pl-0 group-hover:pl-2">Contact VIP</span>
                        <MessageCircle size={24} />
                    </a>

                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 transition-all duration-1000 ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-sm py-4' : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className={`w-10 h-10 flex items-center justify-center rounded-sm transition-colors ${scrolled ? 'bg-navy' : 'bg-white'}`}>
                                    <span className={`font-serif font-bold text-xl ${scrolled ? 'text-white' : 'text-navy'}`}>G</span>
                                </div>
                                <div className="flex flex-col">
                                    <span className={`font-bold tracking-[0.2em] text-sm uppercase ${scrolled ? 'text-navy' : 'text-white'}`}>Global Mix</span>
                                    <span className="text-[10px] tracking-[0.3em] text-gold uppercase font-semibold">Luxury Train</span>
                                </div>
                            </div>

                            <nav className={`hidden md:flex gap-10 text-[10px] font-bold uppercase tracking-[0.2em] ${scrolled ? 'text-gray-600' : 'text-white/90'}`}>
                                <a href="#" className="hover:text-gold transition-colors">Journeys</a>
                                <a href="#collection" className="hover:text-gold transition-colors">Collection</a>
                                <a href="#heritage" className="hover:text-gold transition-colors">Heritage</a>
                            </nav>

                            <div className="flex items-center gap-4">
                                <button className="md:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                    {isMenuOpen ? <X className={scrolled ? 'text-navy' : 'text-white'} /> : <Menu className={scrolled ? 'text-navy' : 'text-white'} />}
                                </button>
                                <a href={`https://wa.me/${contactData.whatsapp}`} className={`hidden md:inline-block px-8 py-3 text-[10px] font-bold uppercase tracking-widest hover:bg-gold transition-all duration-500 rounded-sm ${scrolled ? 'bg-navy text-white' : 'bg-white text-navy'}`}>
                                    Inquire Now
                                </a>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="relative h-screen flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img src={"https://images.unsplash.com/photo-1505832018823-50331d70d237?q=80&w=1808&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"} alt="Luxury Train Scene" className="w-full h-full object-cover scale-105" />
                            <div className="absolute inset-0 bg-black/40"></div>
                        </div>
                        
                        <div className="absolute bottom-12 left-1/2 -translate-x-1/2 flex flex-col items-center gap-4 text-white/40">
                            <span className="text-[9px] uppercase tracking-[0.4em]">Scroll Down</span>
                            <div className="w-px h-16 bg-gradient-to-b from-white to-transparent" />
                        </div>
                    </section>

                    {/* Welcome / Heritage */}
                    <section id="heritage" className="py-40 px-6 max-w-6xl mx-auto text-center">
                        <span className="text-gold uppercase tracking-[0.5em] text-[10px] font-bold italic block mb-6">The Art of Slow Travel</span>
                        <h2 className="text-4xl md:text-6xl font-serif mb-20 text-navy leading-tight">Legendary Routes, Timeless Luxury</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-16 text-left">
                            <div className="space-y-6">
                                <div className="w-12 h-12 rounded-full bg-gold/10 flex items-center justify-center text-gold"><Train size={24} /></div>
                                <h4 className="text-xl font-serif text-navy">Heritage Rolling Stock</h4>
                                <p className="text-gray-500 text-sm leading-relaxed font-light">Meticulously restored vintage carriages that tell stories of elegance and history from a bygone era.</p>
                            </div>
                            <div className="space-y-6">
                                <div className="w-12 h-12 rounded-full bg-gold/10 flex items-center justify-center text-gold"><Utensils size={24} /></div>
                                <h4 className="text-xl font-serif text-navy">Gastronomic Excellence</h4>
                                <p className="text-gray-500 text-sm leading-relaxed font-light">Fine dining experiences prepared by world-renowned chefs, paired with the finest local and international wines.</p>
                            </div>
                            <div className="space-y-6">
                                <div className="w-12 h-12 rounded-full bg-gold/10 flex items-center justify-center text-gold"><Compass size={24} /></div>
                                <h4 className="text-xl font-serif text-navy">Immersive Horizons</h4>
                                <p className="text-gray-500 text-sm leading-relaxed font-light">Awaken to a new panorama every morning, from the peaks of the Andes to the heart of the Scottish Highlands.</p>
                            </div>
                        </div>
                    </section>

                    {/* Collection Grid */}
                    <section id="collection" className="py-24 bg-gray-50 scroll-mt-20">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-20 gap-8">
                                <div>
                                    <span className="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold">The Masterlist</span>
                                    <h3 className="text-5xl font-serif mt-3 text-navy leading-tight">Elite Rail Collection</h3>
                                    <div className="h-1 w-24 bg-gold mt-6"></div>
                                </div>
                                <div className="flex gap-3 overflow-x-auto pb-2 w-full md:w-auto scrollbar-hide">
                                    {categories.map(cat => (
                                        <button 
                                            key={cat} 
                                            onClick={() => setActiveCategory(cat)}
                                            className={`px-6 py-2 text-[9px] font-bold tracking-widest uppercase transition-all border ${activeCategory === cat ? 'bg-navy text-white border-navy shadow-lg' : 'bg-transparent text-gray-400 border-gray-300 hover:border-gold hover:text-gold'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                                {trainJourneys.filter(j => activeCategory === 'All' || j.category === activeCategory).map((journey) => (
                                    <div 
                                        key={journey.id} 
                                        className="train-card group bg-white shadow-sm hover:shadow-2xl transition-all duration-700 overflow-hidden flex flex-col border border-gray-100 cursor-pointer"
                                        onClick={() => setSelectedJourney(journey)}
                                    >
                                        <div className="h-80 overflow-hidden relative">
                                            <img src={`${journey.image}&fm=webp&q=70&w=800`} alt={journey.title} className="train-image w-full h-full object-cover transition-transform duration-1000" loading="lazy" />
                                            <div className="absolute top-5 right-5 bg-white/95 px-4 py-1.5 text-[9px] font-bold uppercase tracking-widest text-navy shadow-sm">{journey.duration}</div>
                                        </div>
                                        <div className="p-10 flex flex-col flex-grow text-left">
                                            <span className="text-[9px] text-gold font-bold uppercase tracking-[0.3em]">{journey.region}</span>
                                            <h4 className="text-2xl font-serif mt-3 mb-5 text-navy group-hover:text-gold transition-colors">{journey.title}</h4>
                                            <p className="text-[11px] uppercase tracking-wider text-gray-400 font-bold mb-6 italic">{journey.train}</p>
                                            
                                            <div className="pt-8 border-t border-neutral-100 flex justify-between items-center group-hover:border-gold transition-colors duration-500">
                                                <span className="text-[10px] font-bold tracking-[0.4em] uppercase text-neutral-400 group-hover:text-black">Itinerary</span>
                                                <div className="w-10 h-10 rounded-full border border-neutral-200 flex items-center justify-center group-hover:bg-navy group-hover:text-white transition-all duration-500">
                                                    <ChevronRight size={18} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Detail Overlay Modal */}
                    {selectedJourney && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-0 md:p-12 animate-[fadeIn_0.5s_ease-out]">
                            <div className="absolute inset-0 bg-navy/95 backdrop-blur-xl" onClick={() => setSelectedJourney(null)} />
                            
                            <div className="relative bg-white w-full max-w-7xl h-full md:h-auto md:max-h-[85vh] overflow-hidden flex flex-col md:flex-row shadow-2xl">
                                <button 
                                    className="absolute top-10 right-10 z-[110] p-4 bg-navy text-white rounded-full hover:bg-gold hover:scale-110 transition-all"
                                    onClick={() => setSelectedJourney(null)}
                                >
                                    <X size={20} />
                                </button>
                                
                                <div className="w-full md:w-5/12 h-80 md:h-auto relative">
                                    <img 
                                        src={`${selectedJourney.image}&fm=webp`} 
                                        className="w-full h-full object-cover"
                                        alt={selectedJourney.title}
                                    />
                                    <div className="absolute inset-0 bg-gradient-to-t from-navy/60 to-transparent" />
                                    <div className="absolute bottom-12 left-12">
                                        <span className="bg-gold text-navy px-4 py-1.5 text-[9px] font-bold tracking-[0.2em] uppercase mb-4 inline-block">Featured Route</span>
                                        <h2 className="text-white text-4xl md:text-6xl font-serif italic drop-shadow-lg">{selectedJourney.title}</h2>
                                    </div>
                                </div>
                                
                                <div className="w-full md:w-7/12 p-12 md:p-20 overflow-y-auto text-left">
                                    <span className="text-[10px] font-bold tracking-[0.6em] text-gold uppercase mb-6 block">Elite Rail Blueprint</span>
                                    
                                    <div className="flex items-center gap-4 text-neutral-400 mb-10">
                                        <MapPin size={16} />
                                        <span className="text-[11px] font-bold tracking-[0.3em] uppercase">{selectedJourney.region} • {selectedJourney.duration}</span>
                                    </div>
                                    
                                    <p className="text-neutral-600 leading-relaxed mb-16 font-light text-xl italic border-l-2 border-gold/30 pl-8">
                                        "{selectedJourney.description}"
                                    </p>
                                    
                                    <div className="space-y-16 mb-20">
                                        <div className="flex gap-8">
                                            <div className="shrink-0 w-14 h-14 bg-gold/10 rounded-full flex items-center justify-center border border-gold/20 text-gold">
                                                <Train size={24} />
                                            </div>
                                            <div>
                                                <h5 className="text-[10px] font-bold tracking-[0.3em] uppercase text-neutral-400 mb-2">The Carriage</h5>
                                                <p className="text-2xl font-serif text-navy leading-tight">{selectedJourney.train}</p>
                                            </div>
                                        </div>
                                        
                                        <div className="flex gap-8">
                                            <div className="shrink-0 w-14 h-14 bg-neutral-50 rounded-full flex items-center justify-center border border-neutral-100 text-navy">
                                                <Building size={24} />
                                            </div>
                                            <div>
                                                <h5 className="text-[10px] font-bold tracking-[0.3em] uppercase text-neutral-400 mb-4">Signature Residences</h5>
                                                <div className="space-y-2">
                                                    {selectedJourney.hotels.map((hotel, idx) => (
                                                        <p key={idx} className="text-xl font-serif text-neutral-800">• {hotel}</p>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={(e) => handleTripAction(e, selectedJourney)}
                                        className="w-full bg-navy text-white py-7 text-[10px] font-bold tracking-[0.5em] uppercase hover:bg-gold transition-all duration-700 shadow-xl"
                                    >
                                        Enquire for Availability
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Mid Quote */}
                    <section className="py-48 relative text-center text-white overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img src={"https://images.unsplash.com/photo-1550953372-e565922a9451?auto=format&fit=crop&q=80&w=2000&fm=webp"} alt="Rail Luxury" className="w-full h-full object-cover" loading="lazy" />
                            <div className="absolute inset-0 bg-black/60"></div>
                        </div>
                        <div className="relative z-10 max-w-4xl mx-auto px-6">
                            <h3 className="text-4xl md:text-7xl font-serif italic mb-8 leading-tight drop-shadow-xl">"A luxury train journey is the ultimate tribute to the romance of exploration."</h3>
                            <p className="text-[10px] uppercase tracking-[0.5em] font-bold text-gold">Global Mix Luxury Train - Elite Portfolio</p>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-navy text-white py-20 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12 text-left">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 border border-white/20 flex items-center justify-center rounded-sm">
                                    <span className="font-serif font-bold text-2xl">G</span>
                                </div>
                                <div className="flex flex-col">
                                    <span className="font-bold tracking-[0.3em] uppercase text-sm">Global Mix</span>
                                    <span className="text-[10px] tracking-[0.4em] text-gold uppercase font-bold">Luxury Train</span>
                                </div>
                            </div>

                            <div className="flex flex-wrap gap-10 text-[9px] uppercase tracking-[0.3em] text-gray-400 font-bold">
                                <a href="europe.html" className="hover:text-gold transition-colors">Europe</a>
                                <a href="asia.html" className="hover:text-gold transition-colors">Asia</a>
                                <a href="africa.html" className="hover:text-gold transition-colors">Africa</a>
                                <a href="caribe.html" className="hover:text-gold transition-colors">Caribe</a>
                            </div>

                            <div className="text-[9px] text-gray-400 uppercase tracking-[0.2em] font-medium opacity-50">
                                © 2026 Global Mix Network. All Rights Reserved.
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
