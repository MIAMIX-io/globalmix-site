<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Mix - Travel Oceania</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 2s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #fdfdfd; }
        ::-webkit-scrollbar-thumb { background: #111; }
        ::-webkit-scrollbar-thumb:hover { background: #ff5e00; }
    </style>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#fafafa] antialiased">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        import { 
            Compass, MapPin, Ship, Trees, Waves, 
            Menu, X, ChevronRight, ChevronDown, Mail, Phone, Globe, MessageCircle, Star, Building, Map
        } from 'https://esm.sh/lucide-react@0.292.0';

        const App = () => {
            const [selected, setSelected] = useState(null);
            const [scrolled, setScrolled] = useState(false);
            const [activeCategory, setActiveCategory] = useState('All');

            const contactData = {
                phone: "+1 786 459 8797",
                whatsapp: "17864598797",
                email: "info@globalmix.online"
            };

            const itineraries = [
                { id: 1, title: "Australia Iconic Grand Tour", route: "Sydney • Melbourne • Uluru • Cairns", duration: "12 Days", category: "Australia", image: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?auto=format&fit=crop&q=80&w=1000", description: "The complete Oceania masterclass. From the architectural marvels of the Sydney Opera House to the spiritual red heart of the Outback." },
                { id: 2, title: "Australia Wild Luxury", route: "Perth • Margaret River • Ningaloo Reef", duration: "10 Days", category: "Australia", image: "https://images.unsplash.com/photo-1529108190281-9a4f620bc2d8?auto=format&fit=crop&q=80&w=1000", description: "Discover the untamed West. Pristine white beaches, surreal desert landscapes, and the world's most accessible fringe reef." },
                { id: 3, title: "Luxury Outback & Reef", route: "Brisbane • Outback • Lizard Island", duration: "9 Days", category: "Australia", image: "https://images.unsplash.com/photo-1523482580672-f109ba8cb9be?auto=format&fit=crop&q=80&w=1000", description: "An ultra-exclusive duality. Experience the raw spirit of an Australian station before retreating to a private island paradise." },
                { id: 4, title: "New Zealand Alpine & Coastal", route: "Auckland • Rotorua • Queenstown", duration: "10 Days", category: "New Zealand", image: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&q=80&w=1000", description: "A symphony of dramatic landscapes. Witness the geological wonders of the North and the majestic alpine peaks of the South." },
                { id: 5, title: "South Pacific Ultra Paradise", route: "Bora Bora • Tahiti • Tetiaroa", duration: "9 Days", category: "Islands", image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=1000", description: "Unmatched privacy and seclusion. Experience the pinnacle of island luxury in the legendary waters of French Polynesia." }
            ];

            const categories = ["All", "Australia", "New Zealand", "Islands"];

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const handleTripAction = (e, trip) => {
                e.preventDefault();
                const subject = encodeURIComponent(`Requesting Oceania Itinerary: ${trip.title}`);
                const body = encodeURIComponent(`Hello Global Mix VIP Team,\n\nPlease send me availability and details for the "${trip.title}" expedition.\n\nThank you!`);
                window.location.href = `mailto:${contactData.email}?subject=${subject}&body=${body}`;
            };

            return (
                <div className="min-h-screen bg-[#fafafa] text-[#121212] font-sans selection:bg-orange-100">
                    
                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 transition-all duration-1000 ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-sm py-4' : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <Globe className={`w-8 h-8 ${scrolled ? 'text-orange-600' : 'text-white'}`} />
                                <div className="flex flex-col">
                                    <span className={`text-xl font-bold tracking-tighter leading-none ${scrolled ? 'text-black' : 'text-white'}`}>GLOBAL MIX</span>
                                    <span className={`text-[10px] tracking-[0.4em] font-medium ${scrolled ? 'text-orange-600' : 'text-white/80'}`}>OCEANIA</span>
                                </div>
                            </div>

                            <div className="hidden lg:flex items-center gap-10 text-[10px] font-bold tracking-[0.3em] uppercase">
                                <a href="#itineraries" className={`hover:text-orange-600 transition-colors ${scrolled ? 'text-neutral-500' : 'text-white/80'}`}>Itineraries</a>
                                <a href="#concierge" className={`hover:text-orange-600 transition-colors ${scrolled ? 'text-neutral-500' : 'text-white/80'}`}>Concierge</a>
                                <a href="#contact" className={`px-8 py-3 rounded-sm transition-all transform hover:scale-105 ${scrolled ? 'bg-black text-white' : 'bg-white text-black'}`}>INQUIRE NOW</a>
                            </div>

                            <button className="lg:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                {isMenuOpen ? <X className={scrolled ? 'text-black' : 'text-white'} /> : <Menu className={scrolled ? 'text-black' : 'text-white'} />}
                            </button>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="relative h-[95vh] flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0">
                            <img src={"https://images.unsplash.com/photo-1528150235062-8e104be74c3e?auto=format&fit=crop&q=80&w=1920&fm=webp"} className="w-full h-full object-cover scale-105" alt="Oceania Landscape" fetchPriority="high" />
                            <div className="absolute inset-0 bg-gradient-to-b from-black/60 via-black/30 to-black/80" />
                        </div>

                        <div className="relative z-10 text-center px-6 max-w-5xl">
                            <span className="inline-block mb-6 text-white/90 tracking-[0.6em] text-xs font-bold uppercase font-sans animate-fade-in">
                                Exploration • Sophistication • Wild
                            </span>
                            <h1 className="text-6xl md:text-9xl font-serif text-white mb-8 leading-[0.85]">
                                Grand Journeys <br />
                                <span className="italic text-orange-400 drop-shadow-[0_0_15px_rgba(255,255,255,0.7)]">
                                    of Oceania
                                </span>
                            </h1>
                            <p className="text-lg md:text-xl text-white/90 max-w-2xl mx-auto leading-relaxed mb-10 font-light italic font-sans">
                                "Curated journeys across Australia, New Zealand, and the Pacific Islands. Where sophistication meets the wild horizons."
                            </p>
                            <div className="flex justify-center">
                                <a href="#itineraries" className="bg-white text-black px-16 py-6 text-[10px] font-bold tracking-[0.5em] uppercase hover:bg-orange-600 hover:text-white transition-all duration-700 shadow-xl">
                                    Explore Masterlist
                                </a>
                            </div>
                        </div>
                        <a href="#experience" className="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce text-white">
                            <ChevronDown size={32} />
                        </a>
                    </section>

                    {/* Intro */}
                    <section id="experience" className="py-48 px-10 bg-white border-b border-neutral-100">
                        <div className="max-w-4xl mx-auto text-center">
                            <span className="text-orange-600 font-bold text-[11px] tracking-[0.6em] uppercase mb-10 block">EXPERIENCE DESIGN</span>
                            <h2 className="text-3xl md:text-5xl font-serif italic text-neutral-800 leading-[1.3] mb-12">
                                "Oceania is not just a place, but a state of mind. We balance the raw power of nature with the refinements of the modern world."
                            </h2>
                            <div className="w-20 h-px bg-neutral-200 mx-auto" />
                        </div>
                    </section>

                    {/* Itinerary Grid */}
                    <section id="itineraries" className="py-24 bg-[#fdfdfd] scroll-mt-20">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-20 gap-8">
                                <div>
                                    <span className="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold">The Masterlist</span>
                                    <h3 className="text-5xl font-serif mt-3 text-black">Elite Oceania Circuits</h3>
                                    <div className="h-1 w-24 bg-orange-600 mt-6"></div>
                                </div>
                                <div className="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                                    {categories.map(cat => (
                                        <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-6 py-2 text-[9px] font-bold tracking-widest uppercase transition-all border ${activeCategory === cat ? 'bg-black text-white border-black' : 'bg-transparent text-gray-400 border-gray-300 hover:border-orange-600 hover:text-orange-600'}`}>
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                                {itineraries.filter(j => activeCategory === 'All' || j.category === activeCategory).map((item) => (
                                    <div key={item.id} className="group bg-white border border-gray-100 shadow-sm hover:shadow-2xl transition-all duration-700 flex flex-col rounded-2xl overflow-hidden">
                                        <div className="h-80 overflow-hidden relative">
                                            <img src={`${item.image}&fm=webp&q=70&w=800`} alt={item.title} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" loading="lazy" />
                                            <div className="absolute top-5 right-5 bg-white/95 px-4 py-1.5 text-[9px] font-bold uppercase tracking-widest text-black rounded-full shadow-sm">{item.duration}</div>
                                        </div>
                                        <div className="p-10 flex flex-col flex-grow">
                                            <div className="flex items-center gap-2 text-orange-600 mb-4 font-bold text-[10px] tracking-widest uppercase"><Map size={14} /> Premium Circuit</div>
                                            <h4 className="text-2xl font-serif mb-4 text-black group-hover:text-orange-600 transition-colors">{item.title}</h4>
                                            <p className="text-gray-500 text-sm mb-8 font-light leading-relaxed flex-grow">{item.description}</p>
                                            <button onClick={(e) => handleTripAction(e, item)} className="w-full border border-black text-black py-4 text-[9px] font-bold uppercase tracking-[0.3em] hover:bg-black hover:text-white transition-all flex justify-center items-center gap-2 rounded-lg">
                                                Request Details <ChevronRight size={14} />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Concierge Section */}
                    <section id="concierge" className="py-40 bg-[#003135] text-white overflow-hidden scroll-mt-20">
                        <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                            <div className="relative">
                                <div className="aspect-[4/5] overflow-hidden rounded-2xl shadow-2xl">
                                    <img src={"https://images.unsplash.com/photo-1549488344-1f9b8d2bd1f3?q=80&w=1200&auto=format&fit=crop&fm=webp"} 
                                         className="w-full h-full object-cover grayscale opacity-30 hover:grayscale-0 hover:opacity-100 transition-all duration-1000" alt="Oceania Concierge" loading="lazy" />
                                </div>
                                <div className="absolute -bottom-10 -right-10 bg-orange-600 p-12 hidden md:block rounded-sm shadow-2xl transform hover:-translate-y-2 transition-transform duration-500">
                                    <p className="text-4xl italic leading-tight text-white font-serif">Private <br />Concierge <br />In Oceania</p>
                                </div>
                            </div>
                            <div>
                                <h3 className="text-xs font-bold tracking-[0.5em] text-orange-400 uppercase mb-8 font-sans">Specialized Assistance</h3>
                                <h4 className="text-5xl md:text-6xl mb-10 leading-none font-serif text-white">The Luxury of <br/><span className="italic text-orange-400">No Limits.</span></h4>
                                <div className="space-y-12">
                                    <div className="flex gap-6 group">
                                        <div className="shrink-0 w-12 h-12 rounded-full border border-orange-400 flex items-center justify-center text-orange-400 group-hover:bg-orange-400 group-hover:text-[#003135] transition-all duration-500"><Compass size={24} /></div>
                                        <div><h5 className="text-xl mb-3 font-serif">Territory Expertise</h5><p className="text-cyan-100/70 font-sans text-sm leading-relaxed">Our specialists intimately know the terrain, from the sacred Uluru to the glaciers of the Southern Alps.</p></div>
                                    </div>
                                    <div className="flex gap-6 group">
                                        <div className="shrink-0 w-12 h-12 rounded-full border border-orange-400 flex items-center justify-center text-orange-400 group-hover:bg-orange-400 group-hover:text-[#003135] transition-all duration-500"><Ship size={24} /></div>
                                        <div><h5 className="text-xl mb-3 font-serif">Private Vessel Access</h5><p className="text-cyan-100/70 font-sans text-sm leading-relaxed">Access to the region's premier private yachts for exclusive exploration of the Whitsundays and Fiji.</p></div>
                                    </div>
                                    <div className="flex gap-6 group">
                                        <div className="shrink-0 w-12 h-12 rounded-full border border-orange-400 flex items-center justify-center text-orange-400 group-hover:bg-orange-400 group-hover:text-[#003135] transition-all duration-500"><Building size={24} /></div>
                                        <div><h5 className="text-xl mb-3 font-serif">Off-Market Inventory</h5><p className="text-cyan-100/70 font-sans text-sm leading-relaxed">Priority access to private island estates and ultra-luxury lodges that remain unavailable to the public.</p></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer id="contact" className="bg-neutral-950 text-white pt-24 pb-12">
                        <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-4 gap-16 mb-20">
                            <div className="md:col-span-2">
                                <div className="flex items-center gap-3 mb-8">
                                    <Globe className="w-10 h-10 text-orange-600" />
                                    <div className="flex flex-col"><span className="text-2xl font-bold tracking-tighter leading-none">GLOBAL MIX</span><span className="text-[12px] tracking-[0.2em] font-medium text-orange-600">OCEANIA</span></div>
                                </div>
                                <p className="text-gray-400 max-w-sm mb-10 leading-relaxed italic text-sm">"Redefining luxury travel in the Southern Hemisphere through authentic and exclusive expeditions."</p>
                            </div>
                            <div>
                                <h5 className="text-lg font-serif mb-8 border-l-2 border-orange-600 pl-4 uppercase tracking-widest text-sm">Quick Links</h5>
                                <ul className="space-y-4 text-gray-400 text-sm font-bold tracking-widest uppercase">
                                    <li><a href="#" className="hover:text-white transition-colors">Australia</a></li>
                                    <li><a href="#" className="hover:text-white transition-colors">New Zealand</a></li>
                                    <li><a href="#" className="hover:text-white transition-colors">Islands</a></li>
                                </ul>
                            </div>
                            <div>
                                <h5 className="text-lg font-serif mb-8 border-l-2 border-orange-600 pl-4 uppercase tracking-widest text-sm">Contact</h5>
                                <ul className="space-y-6 text-gray-400 text-sm">
                                    <li className="flex items-center gap-4"><Phone size={18} className="text-orange-600" /><span>{contactData.phone}</span></li>
                                    <li className="flex items-center gap-4"><Mail size={18} className="text-orange-600" /><span>{contactData.email}</span></li>
                                    <li className="flex items-center gap-4"><MapPin size={18} className="text-orange-600" /><span>Sydney | Queenstown</span></li>
                                </ul>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-6 pt-10 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-6 text-[10px] text-gray-500 uppercase tracking-widest font-bold">
                            <p>© 2026 GLOBAL MIX Oceania. All rights reserved.</p>
                            <div className="flex gap-8"><span className="hover:text-white cursor-pointer transition-colors">Privacy Policy</span><span className="hover:text-white cursor-pointer transition-colors">Terms &amp; Conditions</span></div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
