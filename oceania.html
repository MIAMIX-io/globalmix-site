<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Mix - Travel Oceania</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 2s ease-out',
                        'bounce': 'bounce 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Oceania theme scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #fdfdfd; }
        ::-webkit-scrollbar-thumb { background: #111; }
        ::-webkit-scrollbar-thumb:hover { background: #ff5e00; }
    </style>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#fafafa] antialiased">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        import { 
            Compass, MapPin, Ship, Trees, Wind, Sun, Waves, Camera, 
            Menu, X, ChevronRight, ChevronDown, Mail, Phone, Globe, MessageCircle, Star, Bed, Building, Map
        } from 'https://esm.sh/lucide-react@0.292.0';

        const App = () => {
            const [selected, setSelected] = useState(null);
            const [scrolled, setScrolled] = useState(false);
            const [activeCategory, setActiveCategory] = useState('All');

            const contactData = {
                phone: "+1 786 459 8797",
                whatsapp: "17864598797",
                email: "info@globalmix.online"
            };

            const itineraries = [
                { id: 1, title: "Australia Iconic Grand Tour", route: "Sydney • Melbourne • Uluru • Cairns", duration: "12 Days", category: "Australia", image: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?auto=format&fit=crop&q=80&w=1000", description: "The complete Oceania masterclass. From the architectural marvels of the Sydney Opera House to the spiritual red heart of the Outback and the vibrant Great Barrier Reef.", experiences: ["Opera House & Harbour private yacht cruise", "Great Ocean Road wildlife safari", "Uluru sunset dinner under the stars"] },
                { id: 2, title: "Australia Wild Luxury", route: "Perth • Margaret River • Ningaloo Reef", duration: "10 Days", category: "Australia", image: "https://images.unsplash.com/photo-1529108190281-9a4f620bc2d8?auto=format&fit=crop&q=80&w=1000", description: "Discover the untamed West. Pristine white beaches, surreal desert landscapes, and the world's most accessible fringe reef.", experiences: ["Swimming with whale sharks at Ningaloo", "Premium wine tasting in Margaret River", "Private seaplane to Rottnest Island"] },
                { id: 3, title: "Luxury Outback & Reef", route: "Brisbane • Outback • Lizard Island", duration: "9 Days", category: "Australia", image: "https://images.unsplash.com/photo-1523482580672-f109ba8cb9be?auto=format&fit=crop&q=80&w=1000", description: "An ultra-exclusive duality. Experience the raw spirit of an Australian station before retreating to a private island paradise.", experiences: ["Authentic cattle station experience", "Private flight to Lizard Island", "Marine biologist guided snorkeling"] },
                { id: 4, title: "New Zealand Alpine & Coastal", route: "Auckland • Rotorua • Queenstown", duration: "10 Days", category: "New Zealand", image: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&q=80&w=1000", description: "A symphony of dramatic landscapes. Witness the geological wonders of the North and the majestic alpine peaks of the South.", experiences: ["Maori cultural immersion", "Helicopter landing on glaciers", "Milford Sound private cruise"] },
                { id: 5, title: "South Pacific Ultra Paradise", route: "Bora Bora • Tahiti • Tetiaroa", duration: "9 Days", category: "Islands", image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=1000", description: "Unmatched privacy and seclusion. Experience the pinnacle of island luxury in the legendary waters of French Polynesia.", experiences: ["Stay at 'The Brando' in Tetiaroa", "Overwater villa with lagoon access", "Private Tahitian stargazing"] }
            ];

            const categories = ["All", "Australia", "New Zealand", "Islands"];

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const handleTripAction = (e, trip) => {
                e.preventDefault();
                const subject = encodeURIComponent(`Requesting Oceania Itinerary: ${trip.title}`);
                const body = encodeURIComponent(`Hello Global Mix VIP Team,\n\nPlease send me availability and details for the "${trip.title}" expedition.\n\nThank you!`);
                window.location.href = `mailto:${contactData.email}?subject=${subject}&body=${body}`;
            };

            return (
                <div className="min-h-screen bg-[#fafafa] text-[#121212] font-sans selection:bg-orange-100">
                    
                    {/* WhatsApp Floating Button */}
                    <a href={`https://wa.me/${contactData.whatsapp}`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-[60] bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center gap-2 group">
                        <span className="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-500 whitespace-nowrap text-sm font-sans font-bold uppercase tracking-widest pl-0 group-hover:pl-2">Contact VIP</span>
                        <MessageCircle size={24} />
                    </a>

                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 transition-all duration-1000 ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-sm py-4' : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <Globe className={`w-8 h-8 ${scrolled ? 'text-orange-600' : 'text-white'}`} />
                                <div className="flex flex-col">
                                    <span className={`text-xl font-bold tracking-tighter leading-none ${scrolled ? 'text-black' : 'text-white'}`}>GLOBAL MIX</span>
                                    <span className={`text-[10px] tracking-[0.4em] font-medium ${scrolled ? 'text-orange-600' : 'text-white/80'}`}>OCEANIA</span>
                                </div>
                            </div>

                            <div className="hidden lg:flex items-center gap-10">
                                {['Itineraries', 'Experience', 'Concierge'].map((link) => (
                                    <a key={link} href={`#${link.toLowerCase()}`} className={`text-[10px] font-bold tracking-[0.3em] uppercase transition-colors ${scrolled ? 'text-neutral-500 hover:text-orange-600' : 'text-white/80 hover:text-white'}`}>{link}</a>
                                ))}
                                <a href="#concierge" className={`px-8 py-3 rounded-sm text-[10px] font-bold tracking-[0.2em] transition-all transform hover:scale-105 ${scrolled ? 'bg-black text-white' : 'bg-white text-black'}`}>INQUIRE NOW</a>
                            </div>

                            <button className="lg:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                {isMenuOpen ? <X className={scrolled ? 'text-black' : 'text-white'} /> : <Menu className={scrolled ? 'text-black' : 'text-white'} />}
                            </button>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="relative h-[95vh] flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0">
                            <img src={"https://images.unsplash.com/photo-1528150235062-8e104be74c3e?auto=format&fit=crop&q=80&w=1920&fm=webp"} className="w-full h-full object-cover scale-105" alt="Oceania Wilderness" fetchPriority="high" />
                            <div className="absolute inset-0 bg-gradient-to-b from-black/60 via-black/30 to-black/80" />
                        </div>

                        <div className="relative z-10 text-center px-6 max-w-6xl">
                            <span className="inline-block mb-6 text-white/90 tracking-[0.6em] text-xs font-bold uppercase font-sans animate-fade-in">
                                Exploration • Sophistication • Wild
                            </span>
                            <h1 className="text-6xl md:text-9xl font-serif text-white mb-8 leading-[0.85]">
                                Grand Journeys <br />
                                <span className="italic text-orange-400 drop-shadow-[0_0_15px_rgba(255,255,255,0.7)]">
                                    of Oceania
                                </span>
                            </h1>
                            <p className="text-lg md:text-xl text-white/90 max-w-2xl mx-auto leading-relaxed mb-10 font-light italic font-sans">
                                "Curated journeys across Australia, New Zealand, and the Pacific Islands. Where sophistication meets the wild horizons."
                            </p>
                            <div className="flex justify-center">
                                <a href="#itineraries" className="bg-white text-black px-16 py-6 text-[10px] font-bold tracking-[0.5em] uppercase hover:bg-orange-600 hover:text-white transition-all duration-700 shadow-xl">
                                    Explore Circuits
                                </a>
                            </div>
                        </div>

                        <a href="#experience" className="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce cursor-pointer hover:opacity-75 transition-opacity z-10 text-white">
                            <ChevronDown size={32} />
                        </a>
                    </section>

                    {/* Experience Intro */}
                    <section id="experience" className="py-48 px-10 bg-white border-b border-neutral-100">
                        <div className="max-w-4xl mx-auto text-center">
                            <span className="text-orange-600 font-bold text-[11px] tracking-[0.6em] uppercase mb-10 block">EXPERIENCE DESIGN</span>
                            <h3 className="text-3xl md:text-5xl font-serif italic text-neutral-800 leading-[1.3] mb-12">
                                "Oceania is not just a place, but a state of mind. We balance the raw power of nature with the ultimate refinements of the modern world."
                            </h3>
                            <div className="w-20 h-px bg-neutral-200 mx-auto" />
                        </div>
                    </section>

                    {/* Itinerary Grid */}
                    <section id="itineraries" className="py-32 px-6 scroll-mt-24 bg-[#fdfdfd]">
                        <div className="max-w-7xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-20 gap-8">
                                <div>
                                    <span className="text-[10px] uppercase tracking-[0.3em] text-gray-400 font-bold">Signature Masterlist</span>
                                    <h3 className="text-5xl font-serif mt-3 text-black">Oceania Collection</h3>
                                    <div className="h-1 w-24 bg-orange-600 mt-6"></div>
                                </div>
                                <div className="flex gap-3 overflow-x-auto pb-2 w-full md:w-auto scrollbar-hide">
                                    {categories.map(cat => (
                                        <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-6 py-2 text-[9px] font-bold tracking-widest uppercase transition-all border ${activeCategory === cat ? 'bg-black text-white border-black shadow-lg' : 'bg-transparent text-gray-400 border-gray-300 hover:border-orange-600 hover:text-orange-600'}`}>
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                                {itineraries.filter(j => activeCategory === 'All' || j.category === activeCategory).map((item) => (
                                    <div key={item.id} className="group cursor-pointer flex flex-col bg-white border border-gray-100 shadow-sm hover:shadow-2xl transition-all duration-700" onClick={() => setSelected(item)}>
                                        <div className="relative aspect-[4/5] overflow-hidden">
                                            <img src={`${item.image}&fm=webp&q=70&w=800`} alt={item.title} className="w-full h-full object-cover transition-transform duration-[2s] group-hover:scale-110" loading="lazy" />
                                            <div className="absolute top-8 left-8 bg-white/95 px-5 py-2 text-[10px] font-bold tracking-widest uppercase text-black">{item.duration}</div>
                                        </div>
                                        <div className="p-10 flex flex-col flex-grow">
                                            <div className="flex items-center gap-3 text-orange-600 mb-6 font-bold text-[10px] tracking-widest uppercase"><Map size={14} /> Premium Circuit</div>
                                            <h4 className="text-3xl font-serif mb-6 group-hover:text-orange-600 transition-colors leading-tight">{item.title}</h4>
                                            <div className="flex items-center gap-3 text-neutral-400 mb-10 text-[10px] font-bold tracking-widest uppercase"><MapPin size={14} /> {item.route}</div>
                                            <button onClick={(e) => handleTripAction(e, item)} className="mt-auto w-full border border-black text-black py-4 text-[9px] font-bold uppercase tracking-[0.3em] hover:bg-black hover:text-white transition-all flex justify-center items-center gap-2">
                                                Request Details <ChevronRight size={14} />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Concierge Section */}
                    <section id="concierge" className="py-40 bg-[#002f35] text-white overflow-hidden scroll-mt-20">
                        <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                            <div className="relative">
                                <div className="aspect-[4/5] overflow-hidden rounded-2xl shadow-2xl">
                                    <img src="https://images.unsplash.com/photo-1549488344-1f9b8d2bd1f3?q=80&w=1200&auto=format&fit=crop&fm=webp" 
                                         className="w-full h-full object-cover grayscale opacity-30 hover:grayscale-0 hover:opacity-100 transition-all duration-1000" alt="Oceania Concierge" loading="lazy" />
                                </div>
                                <div className="absolute -bottom-10 -right-10 bg-orange-600 p-12 hidden md:block rounded-sm shadow-2xl transform hover:-translate-y-2 transition-transform duration-500">
                                    <p className="text-4xl italic leading-tight text-white font-serif">Private <br />Concierge <br />In Oceania</p>
                                </div>
                            </div>
                            <div>
                                <h3 className="text-xs font-bold tracking-[0.5em] text-orange-400 uppercase mb-8 font-sans">SPECIALIZED ASSISTANCE</h3>
                                <h4 className="text-5xl md:text-6xl mb-10 leading-none font-serif text-white">The Luxury of <br/><span className="italic text-orange-400">No Limits.</span></h4>
                                <div className="space-y-12">
                                    <div className="flex gap-6 group">
                                        <div className="shrink-0 w-12 h-12 rounded-full border border-orange-400 flex items-center justify-center text-orange-400 group-hover:bg-orange-400 group-hover:text-[#002f35] transition-all duration-500"><Compass size={24} /></div>
                                        <div><h5 className="text-xl mb-3 font-serif text-[#e0f7fa]">Territory Expertise</h5><p className="text-cyan-100/70 font-sans text-sm">Our specialists intimately know the terrain, from the sacred Uluru to the glaciers of Queenstown.</p></div>
                                    </div>
                                    <div className="flex gap-6 group">
                                        <div className="shrink-0 w-12 h-12 rounded-full border border-orange-400 flex items-center justify-center text-orange-400 group-hover:bg-orange-400 group-hover:text-[#002f35] transition-all duration-500"><Ship size={24} /></div>
                                        <div><h5 className="text-xl mb-3 font-serif text-[#e0f7fa]">Private Fleet</h5><p className="text-cyan-100/70 font-sans text-sm">Access to the region's premier private jet operators, luxury yachts, and off-road expedition vehicles.</p></div>
                                    </div>
                                    <div className="flex gap-6 group">
                                        <div className="shrink-0 w-12 h-12 rounded-full border border-orange-400 flex items-center justify-center text-orange-400 group-hover:bg-orange-400 group-hover:text-[#002f35] transition-all duration-500"><Building size={24} /></div>
                                        <div><h5 className="text-xl mb-3 font-serif text-[#e0f7fa]">Lodge Resourcing</h5><p className="text-cyan-100/70 font-sans text-sm">Priority access to the 'Luxury Lodges of Australia' and exclusive island rentals in the Whitsundays.</p></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer id="contact" className="bg-neutral-950 text-white py-32 px-8">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-20">
                            <div className="md:col-span-2">
                                <div className="flex items-center gap-3 mb-10">
                                    <Globe className="w-10 h-10 text-orange-600" />
                                    <div className="flex flex-col"><span className="text-2xl font-bold tracking-tighter leading-none">GLOBAL MIX</span><span className="text-[12px] tracking-[0.2em] font-medium text-orange-600 uppercase">Oceania</span></div>
                                </div>
                                <p className="text-neutral-500 max-w-sm leading-relaxed mb-12 text-sm italic">"Redefining luxury travel in the Southern Hemisphere through authentic and exclusive expeditions."</p>
                            </div>
                            <div>
                                <h5 className="text-[10px] font-bold tracking-[0.5em] uppercase mb-10 text-neutral-400">Territories</h5>
                                <ul className="flex flex-col gap-6 text-neutral-500 text-[11px] font-medium tracking-wider uppercase">
                                    <li><a href="#itineraries" className="hover:text-white transition-colors">Australian Outback</a></li>
                                    <li><a href="#itineraries" className="hover:text-white transition-colors">New Zealand Alps</a></li>
                                    <li><a href="#concierge" className="hover:text-white transition-colors">Private Concierge</a></li>
                                </ul>
                            </div>
                            <div>
                                <h5 className="text-[10px] font-bold tracking-[0.5em] uppercase mb-10 text-neutral-400">Contact</h5>
                                <ul className="flex flex-col gap-6 text-neutral-500 text-[11px] font-medium tracking-wider">
                                    <li className="flex gap-4"><Phone size={16} className="text-orange-600" /><span>{contactData.phone}</span></li>
                                    <li className="flex gap-4"><Mail size={16} className="text-orange-600" /><a href={`mailto:${contactData.email}`}>{contactData.email}</a></li>
                                    <li className="flex gap-4 text-[9px] uppercase"><span>Sydney | Queenstown | Bora Bora</span></li>
                                </ul>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto pt-20 mt-20 border-t border-neutral-900 flex flex-col md:flex-row justify-between text-[9px] text-neutral-700 tracking-[0.4em] uppercase font-bold">
                            <span>© 2026 GLOBALMIX NETWORK - OCEANIA</span>
                            <div className="flex gap-12 mt-6 md:mt-0"><span>Privacy Policy</span><span>Terms {"&"} Conditions</span></div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
