                                    <span className="hover:text-neutral-400 cursor-pointer">Security</span>
                                    <span className="hover:text-neutral-400 cursor-pointer">Privacy</span>
                                </div>
                            </div>
                        </div>
                    </footer>

                    {/* Experience Modal Overlay */}
                    {selected && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-0 md:p-16">
                            <div className="absolute inset-0 bg-neutral-950/98 backdrop-blur-2xl" onClick={() => setSelected(null)} />

                            <div className="relative bg-white w-full max-w-[1500px] h-full md:h-auto md:max-h-[90vh] overflow-hidden flex flex-col md:flex-row shadow-[0_0_100px_rgba(0,0,0,0.5)]">
                                <button
                                    className="absolute top-12 right-12 z-[110] p-4 bg-black text-white rounded-full hover:bg-orange-600 transition-all duration-500"
                                    onClick={() => setSelected(null)}
                                >
                                    <Icons.X />
                                </button>

                                <div className="w-full md:w-1/2 h-80 md:h-auto relative">
                                    <img
                                        src={`${selected.image}&fm=webp`}
                                        className="w-full h-full object-cover"
                                        alt={selected.title}
                                    />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent" />
                                    <div className="absolute bottom-16 left-16">
                                        <span className="bg-white px-6 py-2 text-[11px] font-bold tracking-[0.5em] uppercase mb-4 inline-block text-black">
                                            Featured Route
                                        </span>
                                        <h2 className="text-white text-4xl md:text-7xl font-serif italic">{selected.title}</h2>
                                    </div>
                                </div>

                                <div className="w-full md:w-1/2 p-12 md:p-24 overflow-y-auto">
                                    <div className="flex items-center gap-6 mb-12">
                                        <span className="w-12 h-px bg-orange-600"></span>
                                        <span className="text-[12px] font-bold tracking-[0.6em] text-orange-600 uppercase">Circuit Blueprint</span>
                                    </div>

                                    <div className="flex items-center gap-4 text-neutral-400 mb-10">
                                        <Icons.MapPin />
                                        <span className="text-[12px] font-bold tracking-[0.3em] uppercase">{selected.route}</span>
                                    </div>

                                    <p className="text-neutral-600 leading-relaxed mb-20 font-light text-xl italic border-l-2 border-neutral-100 pl-10 py-2">
                                        {selected.description}
                                    </p>

                                    <div className="mb-20">
                                        <h5 className="text-[12px] font-bold tracking-[0.5em] uppercase text-neutral-400 mb-12">Signature Experiences</h5>
                                        <ul className="space-y-8">
                                            {selected.experiences.map((exp, i) => (
                                                <li key={i} className="flex gap-8 group/item">
                                                    <span className="text-orange-600 font-serif italic text-2xl opacity-30 group-hover/item:opacity-100 transition-opacity">0{i+1}</span>
                                                    <p className="text-lg font-light text-neutral-800 border-b border-neutral-50 pb-4 w-full">
                                                        {exp}
                                                    </p>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div className="flex flex-col gap-10">
                                        <button 
                                            onClick={(e) => handleTripAction(e, selected, "Oceania")}
                                            className="w-full bg-black text-white py-8 text-[11px] font-bold tracking-[0.6em] uppercase hover:bg-orange-600 transition-all duration-700 shadow-2xl"
                                        >
                                            Enquire for Private Dates
                                        </button>
                                        <div className="flex justify-between text-[9px] font-bold tracking-[0.3em] text-neutral-300 uppercase">
                                            <span className="flex items-center gap-3"><Icons.Star /> Expert Wildlife Guides</span>
                                            <span className="flex items-center gap-3"><Icons.Waves /> Private Vessel Access</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
