    <script>
        window.TRIP_DATA = {"notionPageId":"4cac2084-70d3-4050-bbd4-58e25a2d4fe1","id":"OC-02","title":"Tasmania Southern Ocean Escape","region":"Oceania","safeRegion":"oceania","category":"Coastal","duration":"8 Days","countries":"Hobart, Freycinet & Bruny Island","route":"Hobart • Freycinet • Bruny Island","experiences":"Wineglass Bay hike and private beach access | Oyster farm experience (tasting fresh from the water) | Bruny Island high-speed coastal adventure | Private dinner at MONA (Museum of Old and New Art) | Luxury eco-retreat nestled in the forest","hotels":"Hobart: The Tasman, a Luxury Collection Hotel | MACq 01 Hotel | The Henry Jones Art Hotel\nFreycinet: Saffire Freycinet | Freycinet Lodge | Friendly Beaches Lodge (Bay of Fires / east-coast add-on)\nBruny Island: Adventure Bay Retreat | Bruny Island Secrets Retreat | Cloudy Bay Villa","image":"https://images.unsplash.com/photo-1712761384059-d7e6c87b6bc7?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D","slug":"hobart-freycinet-bruny-island-oc-02","pageContentHtml":"\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Cover Article\u003c/h3>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">Tasmania is the edge of the world in the most beautiful way—rugged coastlines, eucalyptus air, dramatic peaks, and seafood so fresh it still tastes like the ocean. This 8-day luxury escape moves through the island’s southern highlights—Hobart, Freycinet, and Bruny Island—with a sensory focus on wild nature, design-forward culture, and quietly exclusive experiences.\u003c/p>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">Expect signature moments woven into an unhurried, high-touch pace: a Wineglass Bay hike with private beach access, an oyster farm tasting fresh from the water, a Bruny Island high-speed coastal adventure, and an unforgettable private dinner at MONA. Between it all, the journey anchors in a luxury eco-retreat nestled in the forest, where deep stillness becomes part of the itinerary.\u003c/p>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Run of Show (8 Days)\u003c/h3>\u003ch4 class=\"text-2xl font-serif text-gray-900 mt-8 mb-3\">At-a-glance\u003c/h4>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Days 1–3 (Hobart): Arrival, waterfront culture, MONA private night, culinary focus\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Days 4–6 (Freycinet): Wineglass Bay, coastal peaks, eco-retreat serenity, seafood rituals\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Days 7–8 (Bruny Island): Adventure coastline, oysters, slow finale, departure\u003c/li>\u003ch4 class=\"text-2xl font-serif text-gray-900 mt-8 mb-3\">Logistics snapshot\u003c/h4>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Route: Hobart → Freycinet → Bruny Island\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Style: Private transfers + curated nature and culinary experiences\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Pace: Balanced (active mornings, restorative afternoons)\u003c/li>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Day-by-day Details\u003c/h3>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 1 — Arrival in Hobart (harbor-side reset)\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" st <body class="antialiased bg-[#FDFBF7]">
    <div id="root"></div>

    <script type="text/babel" data-type="module">

        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { MapPin, Star, Bed, ChevronRight, Globe } from 'https://esm.sh/lucide-react@0.292.0';

        const TripPage = () => {
            const trip = window.TRIP_DATA;
            const [scrolled, setScrolled] = useState(false);

            // Dynamic Region Styling Dictionary
            const themes = {
                "Africa": { mainBg: "bg-[#2D3E2F]", accent: "text-[#B4924A]", bgAccent: "bg-[#B4924A]", heroDrop: "drop-shadow-[0_0_15px_rgba(255,255,255,0.7)] text-[#1A3626]" },

                "Latin America": { mainBg: "bg-[#002147]", accent: "text-[#C5A059]", bgAccent: "bg-[#C5A059]", heroDrop: "drop-shadow-lg text-white" },

                "North America": { mainBg: "bg-[#0f172a]", accent: "text-[#C5A059]", bgAccent: "bg-[#C5A059]", heroDrop: "drop-shadow-lg text-[#C5A059]" }
            };

            // Fallback to Europe theme if region isn't explicitly matched
            const theme = themes[trip.region] || themes["Europe"]; 

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-serif text-[#1A1A1A]">

                        <div className="relative z-10 text-center px-6 max-w-4xl">

                                <div

        };

        const root = createRoot(document.getElementById('root'));

    </script>
</body>
