    <script>
        window.TRIP_DATA = {"notionPageId":"0e704d94-46d7-41f1-a3dd-4d3a12578bf2","id":"LA-06","title":"Amazon & Jaguar Safari","region":"Latin America","safeRegion":"latin-america","category":"Wildlife","duration":"14 Days","countries":"Amazon, Pantanal & Ibera","route":"Amazon Rainforest → Pantanal → Esteros de Ibera ","experiences":"Twice-daily skiff and canoe excursions on Aqua Nera (wildlife + flooded forest) | Pink river dolphin spotting in blackwater tributaries | Night spotlighting for caiman and nocturnal mammals | Chef Pedro Miguel Schiaffino Amazon-forward tasting menus onboard | Pantanal boat-based jaguar tracking near Porto Jofre | Giant otter and jabiru stork encounters on river safaris | Guided walks + 4x4 game drives with ethical wildlife focus","hotels":"Aqua Nera Cruise, Caimán Ecological Refuge Pantanal, Rincón del Socorro Esteros del Ibera ","image":"https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&q=80&w=1200","slug":"amazon-pantanal-ibera-la-06","pageContentHtml":"\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Cover Article\u003c/h3>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">Amazon and Jaguar Safari is a Latin America journey designed as three distinct ecosystems with one continuous, high touch flow: the immersive waterways of the Amazon rainforest, the wildlife rich river corridors of the Pantanal, and the open wetlands and grasslands of Esteros del Ibera.\u003c/p>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">In the Amazon, the experience is texture and depth: blackwater channels, night sounds that never fully fade, and small encounters that feel cinematic, from pink river dolphins to canopy movement on guided walks. In the Pantanal, the rhythm becomes clarity: long sightlines, wildlife rich riverbanks, and boat based tracking near Porto Jofre, where the day’s best moment can be a jaguar stepping out of the brush and holding a calm, unhurried gaze. In Ibera, it turns to scale and stillness: immense skies, mirror like lagoons, and one of the most compelling conservation stories in South America, with close range encounters that can include capybara, caiman, marsh deer, and an extraordinary concentration of birdlife.\u003c/p>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">This itinerary is built for travelers who want luxury logistics without losing the rawness of place. It prioritizes expert naturalist guiding, ethical wildlife viewing, and lodge stays that keep transfers efficient so more time is spent in the field.\u003c/p>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Suggested Itinerary (14 Days)\u003c/h3>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">This is a web informed, best practice schedule. Lodges and flight routings can be swapped based on availability, budget, and preferred entry city.\u003c/p>\u003ch4 class=\"text-2xl font-serif text-gray-900 mt-8 mb-3\">At a glance\u003c/h4>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Days 1 to 5: Amazon (Manaus plus luxury river or lodge based exploration)\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Days 6 to 10: Pantanal (Cuiaba plus Porto Jofre jaguar focus)\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Days 11 to 14: Esteros del Ibera (Corrientes province wetlands)\u003c/li>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Day by day details (drop downs)\u003c/h3>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 1: Arrive Manaus, gateway to the Amazon\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Arrival and VIP meet and greet\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Hotel check in and downtime after international travel\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Optional Teatro Amazonas visit and a riverside welcome dinner\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Goal: reset your sleep schedule and be ready for an early departure tomorrow\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 2: Into the rainforest, transfer and first exploration\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Morning transfer to embarkation or to your rainforest lodge, depending on the selected Amazon style\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Orientation briefing with your naturalist team\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Late afternoon canoe or skiff outing for birds and primates\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Evening spotlight safari for caiman, frogs, and nocturnal mammals\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 3: Amazon by water, dolphins and flooded forest\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Sunrise birding by canoe in calmer channels\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Midday blackwater tributary exploration and pink river dolphin spotting\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Afternoon forest walk focused on ecology, medicinal plants, and tracking\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Evening chef led Amazon forward dinner and an optional guide talk on local conservation\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 4: Deep Amazon immersion, walks and cultural touchpoints\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Morning longer guided hike focused on canopy activity, primates, and micro wildlife\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Midday downtime, pool, siesta, or spa if available\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Afternoon community visit when appropriate and ethical\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Evening nocturnal walk for insects, owls, and night sounds\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 5: Final Amazon morning, return toward transit\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Sunrise excursion based on what you want more of, water, walk, or photography\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Late morning transfer back toward Manaus\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Evening overnight in Manaus for clean logistics\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 6: Fly to Cuiaba, transfer into the Northern Pantanal\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Flight routing Manaus to Cuiaba, sometimes via Sao Paulo\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Private transfer toward the Pantanal staging point\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Late afternoon first Pantanal drive for capybara, caiman, and birds\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Goal: position close to the river corridor where jaguar tracking is strongest\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 7: Porto Jofre jaguar focus, boat safari\n                            \u0 an>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Dedicated full day with expert trackers and naturalists\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Best day for photography and longer behavioral sightings\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Optional sunset stop for golden hour landscapes\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 9: Pantanal variety, walking and night viewing\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Morning guided walk for tracks, plants, and smaller wildlife\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Afternoon 4x4 safari to cover different habitats\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Evening spotlighting for nocturnal species\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 10: Last river push, flexible afternoon\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Final high priority river safari targeting any missed sightings\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Flexible afternoon to relax, edit photos, or take a short nature walk\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Evening celebration dinner and recap with your guide, including a species list highlight\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 11: Travel to Esteros del Ibera, Corrientes province\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Transfer back to Cuiaba and fly to Corrientes or Posadas, routing depends on schedules\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Private transfer into the Ibera gateway area, commonly Colonia Carlos Pellegrini or a nearby lodge zone\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Late afternoon first lagoon excursion for birdlife and sunset light\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Goal: arrive with enough daylight for a soft landing and your first wetlands impression\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 12: Ibera by water, lagoons, capybara, and caiman\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Morning boat or canoe excursion through lagoons and channels\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Wildlife focus on capybara, caiman, marsh deer, and an exceptional range of birds\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Midday rest and lodge time\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Afternoon second outing timed for light and activity\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 13: Ibera on foot and by vehicle, conservation and wildlife\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n t-gray-600 mb-3 leading-relaxed\">Morning transfer out to Corrientes or Posadas for onward flights\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Optional add on ideas include Iguazu Falls, Buenos Aires, or a short Uruguay extension\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Notes for planning\u003c/h3>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Seasonality: The Pantanal dry season, roughly July through October, typically concentrates wildlife and improves jaguar sighting odds.\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Ibera timing: Cooler months often bring clearer skies and comfortable walking, while warmer months can be lush and dramatic.\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Pacing: This structure protects full field days in each ecosystem and keeps transit days as clean as possible.\u003c/li>\u003cli class=\"ml-6 list-decimal text-gray-600 mb-3 leading-relaxed\">Wildlife ethics: Prioritize operators that respect distance and animal behavior at all times.\u003c/li>"};
    </script>
</head>
<body class="antialiased bg-[#FDFBF7]">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { MapPin, Star, Bed, ChevronRight, Globe } from 'https://esm.sh/lucide-react@0.292.0';

        const TripPage = () => {
            const trip = window.TRIP_DATA;
            const [scrolled, setScrolled] = useState(false);

            // Dynamic Region Styling Dictionary
            const themes = {
                "Africa": { mainBg: "bg-[#2D3E2F]", accent: "text-[#B4924A]", bgAccent: "bg-[#B4924A]", heroDrop: "drop-shadow-[0_0_15px_rgba(255,255,255,0.7)] text-[#1A3626]" },
                "Asia": { mainBg: "bg-[#2C0A0A]", accent: "text-[#AF8B58]", bgAccent: "bg-[#AF8B58]", heroDrop: "drop-shadow-lg text-[#AF8B58]" },
                "Europe": { mainBg: "bg-[#002147]", accent: "text-[#B4924A]", bgAccent: "bg-[#B4924A]", heroDrop: "drop-shadow-lg text-[#B4924A]" },
                "Latin America": { mainBg: "bg-[#002147]", accent: "text-[#C5A059]", bgAccent: "bg-[#C5A059]", heroDrop: "drop-shadow-lg text-white" },
                "Caribbean": { mainBg: "bg-[#006064]", accent: "text-[#00ced1]", bgAccent: "bg-[#00ced1]", heroDrop: "drop-shadow-lg text-white" },
                "Oceania": { mainBg: "bg-[#111111]", accent: "text-[#ea580c]", bgAccent: "bg-[#ea580c]", heroDrop: "drop-shadow-lg text-white" },
                "North America": { mainBg: "bg-[#0f172a]", accent: "text-[#C5A059]", bgAccent: "bg-[#C5A059]", heroDrop: "drop-shadow-lg text-[#C5A059]" }
            };

            // Fallback to Europe theme if region isn't explicitly matched
            const theme = themes[trip.region] || themes["Europe"]; 

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-serif text-[#1A1A1A]">
                    {/* Header */}
                    <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? `${theme.mainBg}/95 backdrop-blur-md shadow-xl py-4` : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <Globe className={`w-8 h-8 ${theme.accent}`} />
                                <div className="flex flex-col">
                                    <span className="text-xl font-bold tracking-tighter leading-none text-white font-sans uppercase">Global Mix</span>
                                    <span className={`text-[10px] tracking-[0.4em] font-medium font-sans uppercase ${theme.accent}`}>Travel {trip.region}</span>
                                </div>
                            </div>
                            <button className={`${theme.bgAccent} text-white px-8 py-3 text-[10px] font-bold tracking-[0.2em] font-sans hover:scale-105 transition-transform`}>
                                REQUEST ITINERARY
                            </button>
                        </div>
                    </nav>

                    {/* Hero */}
                    <section className="relative h-[80vh] flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img src={trip.image} className="w-full h-full object-cover scale-105" alt={trip.title} />
                            <div className={`absolute inset-0 bg-gradient-to-b from-${theme.mainBg.replace('bg-', '')}/80 via-transparent to-${theme.mainBg.replace('bg-', '')}/90`} />
                        </div>
                        <div className="relative z-10 text-center px-6 max-w-4xl">
                            <span className={`inline-block mb-6 tracking-[0.6em] text-xs font-bold uppercase font-sans ${theme.accent}`}>
                                Exclusive {trip.duration} Expedition
                            </span>
                            <h1 className="text-6xl md:text-8xl font-serif text-white mb-8 leading-[0.85]">
                                {trip.title.split(' ').slice(0, -1).join(' ')} <br />
                                <span className={`italic ${theme.heroDrop}`}>
                                    {trip.title.split(' ').slice(-1)}
                                </span>
                            </h1>
                        </div>
                    </section>

                    {/* Content Details */}
                    <section className="py-24 px-6 max-w-4xl mx-auto bg-white -mt-20 relative z-20 shadow-2xl rounded-t-3xl">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-16">
                            <div>
                                <h3 className={`text-xs font-bold tracking-[0.4em] uppercase mb-4 font-sans ${theme.accent}`}>The Route</h3>
                                <p className="text-xl italic text-[#1A1A1A] mb-8">{trip.route}</p>
                                
                                <h3 className={`text-xs font-bold tracking-[0.4em] uppercase mb-4 font-sans ${theme.accent}`}>Featured Accommodations</h3>
                                <p className="text-sm font-sans text-gray-600 leading-relaxed">{trip.hotels}</p>
                            </div>
                            <div>
                                <h3 className={`text-xs font-bold tracking-[0.4em] uppercase mb-6 font-sans flex items-center gap-2 ${theme.accent}`}>
                                    <Star size={16} /> Curated Experiences
                                </h3>
                                <ul className="space-y-4">
                                    {(trip.experiences || "").split(',').map((exp, i) => (
                                        <li key={i} className="text-sm text-gray-600 flex items-start gap-3 font-sans">
                                            <span className={`w-1.5 h-1.5 rounded-full mt-1.5 shrink-0 ${theme.bgAccent}`} />
                                            {exp.trim()}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>

                        {/* Notion Page Content Block */}
                        {trip.pageContentHtml && (
                            <div className="mt-12 pt-12 border-t border-gray-200">
                                <span className={`text-[10px] font-bold tracking-[0.4em] uppercase mb-6 block font-sans ${theme.accent}`}>
                                    The Journey Details
                                </span>
                                
                                {/* dangerouslySetInnerHTML is React's way of rendering raw HTML strings */}
                                <div 
                                    className="notion-content-container font-sans" 
                                    dangerouslySetInnerHTML={{ __html: trip.pageContentHtml }} 
                                />
                            </div>
                        )}
                    </section>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TripPage />);
    </script>
</body>
</html>
