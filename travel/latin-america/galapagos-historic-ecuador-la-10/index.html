    <script>
        window.TRIP_DATA = {"notionPageId":"ab489113-33e4-48f1-a8d6-6141b8155b5b","id":"LA-10","title":"Galapagos Evolution Voyage","region":"Latin America","safeRegion":"latin-america","category":"Wildlife","duration":"8 Days","countries":"Galapagos & Historic Ecuador","route":"Galapagos Islands → Mainland Ecuador","experiences":"N/A","hotels":"Aqua Mare Cruise, Hotel Del Parque Relais & Chateaux","image":"https://images.unsplash.com/photo-1590818612486-6b1a277a6601?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D","slug":"galapagos-historic-ecuador-la-10","pageContentHtml":"\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Cover Article\u003c/h3>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">The Galápagos is evolution in real time—marine iguanas warming on lava rock, giant tortoises moving with ancient patience, and sea lions turning the ocean into a playground. This 8-day luxury journey pairs an intimate expedition cruise aboard Aqua Mare with a refined mainland Ecuador finale at Hotel Del Parque (Relais & Châteaux)—blending wild, otherworldly wildlife encounters with culture, cuisine, and quiet elegance.\u003c/p>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">Designed for travelers who want meaningful access without sacrificing comfort, each day balances guided naturalist-led exploration—snorkeling, pangas, coastal hikes—with restorative shipboard luxury. The final mainland chapter adds a sophisticated contrast: historic ambiance, curated culinary moments, and a gentle decompression after the islands’ sensory intensity.\u003c/p>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Run of Show (8 Days)\u003c/h3>\u003ch4 class=\"text-2xl font-serif text-gray-900 mt-8 mb-3\">At-a-glance\u003c/h4>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Days 1–6 (Galápagos / Aqua Mare): Expedition cruising, daily wildlife landi <body class="antialiased bg-[#FDFBF7]">
