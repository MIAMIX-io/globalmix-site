    <script>
        window.TRIP_DATA = {"notionPageId":"8920c225-2267-4b43-9a5b-98a56f6c8bf6","id":"AS-03","title":"Bali & Spiritual Indonesia","region":"Asia","safeRegion":"asia","category":"Tropical","duration":"8 Days","countries":"Indonesia","route":"Bali → Ubud → Nusa Dua","experiences":"Nusa Dua cabana day + St. Regis Bali spa ritual | Ubud private temple circuit (Tirta Empul-style water blessing, crowd-avoidance timing) | Sunrise rice-terrace walk (Tegalalang-style) with photo stops | Balinese cooking class and market visit | Artisan studios (silver, woodcarving, batik) with curator | Four Seasons Sayan riverfront yoga / meditation and wellbeing programming | Private waterfall excursion and jungle swim (conditions permitting) | Sunset cliffside aperitif + reservation-only dining","hotels":"St. Regis Bali Resort, Four Seasons Resort Bali at Sayan","image":"https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&q=80&w=1200","slug":"indonesia-as-03","pageContentHtml":"\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Cover Article\u003c/h3>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">Bali is more than a destination—it’s a mood of soft light, incense in the air, ocean rituals, and emerald-green jungle that invites you to slow down. This 8-day itinerary blends beachfront glamour with deep, spiritual restoration, moving from Bali’s coast to the rainforest calm of Ubud and finishing in Nusa Dua with effortless luxury.\u003c/p>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">Anchored by two iconic stays—The St. Regis Bali Resort and Four Seasons Resort Bali at Sayan—the journey is designed for travelers who want the island’s most refined comforts alongside meaningful cultural moments: temple serenity, curated wellness, artisan craft, and long, unhurried meals. The pace is intentionally balanced: immersive mornings, restorative afternoons, and sunset rituals that feel unmistakably Bali.\u003c/p>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Run of Show (8 Days)\u003c/h3>\u003ch4 class=\"text-2xl font-serif text-gray-900 mt-8 mb-3\">At-a-glance\u003c/h4>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Days 1–2 (Bali Coast / Nusa Dua – St. Regis): Arrival, beachfront reset, refined dining, ocean rhythm\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Days 3–6 (Ubud – Four Seasons at Sayan): Jungle sanctuary, wellness, temples, culture + craft\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Days 7–8 (Return to Coast / Nusa Dua): Final beach luxury, spa, departure\u003c/li>\u003ch4 class=\"text-2xl font-serif text-gray-900 mt-8 mb-3\">Logistics snapshot\u003c/h4>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Route: Bali (coast) → Ubud → Nusa Dua\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Style: Premium hotels + private transfers + curated reservations\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Pace: Wellness-forward, culture-balanced\u003c/li>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Day-by-day Details\u003c/h3>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 1 — Arrival in Bali (St. Regis beachfront welcome)\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 5 — Ubud: Craft, rice terraces & slow luxury\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Slow morning: breakfast and a calm start\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Curated experience (tailored): artisan workshops, galleries, and scenic rice-terrace viewpoints\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Lunch plan curated around the day’s route\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Afternoon: pool calm, yoga-style session, or quiet suite time\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Evening: chef-led dining and low-key lounge finish\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 6 — Ubud: Wellness day (choose-your-pace)\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Unhurried morning: sunrise light and relaxed breakfast\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Signature wellness focus (tailored): breathwork, yoga, or a spa ritual\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Leisure lunch, followed by open afternoon for deep rest\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Farewell-to-Ubud dinner: elevated, intimate finale\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 7 — Return to Nusa Dua (final beach chapter)\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Private transfer back to the coast\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Check-in/reset and settle into the final beach rhythm\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Afternoon: beach time, pool calm, and last-minute boutique moments (tailored)\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Evening: sunset aperitif and prime dinner reservation\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 8 — Departure (final swim + private transfer)\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Breakfast and a last shoreline walk\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Final swim or spa window (if timing allows)\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Private transfer and departure\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">End of itinerary\u003c/li>\n                        \u003c/div>\n                    \u003c/details>"};
    </script>

<body class="antialiased bg-[#FDFBF7]">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { MapPin, Star, Bed, ChevronRight, Globe } from 'https://esm.sh/lucide-react@0.292.0';

        const TripPage = () => {
            const trip = window.TRIP_DATA;
            const [scrolled, setScrolled] = useState(false);

            // Dynamic Region Styling Dictionary
            const themes = {
                "Africa": { mainBg: "bg-[#2D3E2F]", accent: "text-[#B4924A]", bgAccent: "bg-[#B4924A]", heroDrop: "drop-shadow-[0_0_15px_rgba(255,255,255,0.7)] text-[#1A3626]" },
                "Asia": { mainBg: "bg-[#2C0A0A]", accent: "text-[#AF8B58]", bgAccent: "bg-[#AF8B58]", heroDrop: "drop-shadow-lg text-[#AF8B58]" },
                "Europe": { mainBg: "bg-[#002147]", accent: "text-[#B4924A]", bgAccent: "bg-[#B4924A]", heroDrop: "drop-shadow-lg text-[#B4924A]" },
                "Latin America": { mainBg: "bg-[#002147]", accent: "text-[#C5A059]", bgAccent: "bg-[#C5A059]", heroDrop: "drop-shadow-lg text-white" },
                "Caribbean": { mainBg: "bg-[#006064]", accent: "text-[#00ced1]", bgAccent: "bg-[#00ced1]", heroDrop: "drop-shadow-lg text-white" },
                "Oceania": { mainBg: "bg-[#111111]", accent: "text-[#ea580c]", bgAccent: "bg-[#ea580c]", heroDrop: "drop-shadow-lg text-white" },
                "North America": { mainBg: "bg-[#0f172a]", accent: "text-[#C5A059]", bgAccent: "bg-[#C5A059]", heroDrop: "drop-shadow-lg text-[#C5A059]" }
            };

            // Fallback to Europe theme if region isn't explicitly matched
            const theme = themes[trip.region] || themes["Europe"]; 

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-serif text-[#1A1A1A]">
                    {/* Header */}
                    <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? `${theme.mainBg}/95 backdrop-blur-md shadow-xl py-4` : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <Globe className={`w-8 h-8 ${theme.accent}`} />
                                <div className="flex flex-col">
                                    <span className="text-xl font-bold tracking-tighter leading-none text-white font-sans uppercase">Global Mix</span>
                                    <span className={`text-[10px] tracking-[0.4em] font-medium font-sans uppercase ${theme.accent}`}>Travel {trip.region}</span>
                                </div>
                            </div>
                            <button className={`${theme.bgAccent} text-white px-8 py-3 text-[10px] font-bold tracking-[0.2em] font-sans hover:scale-105 transition-transform`}>
                                REQUEST ITINERARY
                            </button>
                        </div>
                    </nav>

                    {/* Hero */}
                    <section className="relative h-[80vh] flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img src={trip.image} className="w-full h-full object-cover scale-105" alt={trip.title} />
                            <div className={`absolute inset-0 bg-gradient-to-b from-${theme.mainBg.replace('bg-', '')}/80 via-transparent to-${theme.mainBg.replace('bg-', '')}/90`} />
                        </div>
                        <div className="relative z-10 text-center px-6 max-w-4xl">
                            <span className={`inline-block mb-6 tracking-[0.6em] text-xs font-bold uppercase font-sans ${theme.accent}`}>
                                Exclusive {trip.duration} Expedition
                            </span>
                            <h1 className="text-6xl md:text-8xl font-serif text-white mb-8 leading-[0.85]">
                                {trip.title.split(' ').slice(0, -1).join(' ')} <br />
                                <span className={`italic ${theme.heroDrop}`}>
                                    {trip.title.split(' ').slice(-1)}
                                </span>
                            </h1>
                        </div>
                    </section>

                    {/* Content Details */}
                    <section className="py-24 px-6 max-w-4xl mx-auto bg-white -mt-20 relative z-20 shadow-2xl rounded-t-3xl">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-16">
                            <div>
                                <h3 className={`text-xs font-bold tracking-[0.4em] uppercase mb-4 font-sans ${theme.accent}`}>The Route</h3>
                                <p className="text-xl italic text-[#1A1A1A] mb-8">{trip.route}</p>
                                
                                <h3 className={`text-xs font-bold tracking-[0.4em] uppercase mb-4 font-sans ${theme.accent}`}>Featured Accommodations</h3>
                                <p className="text-sm font-sans text-gray-600 leading-relaxed">{trip.hotels}</p>
                            </div>
                            <div>
                                <h3 className={`text-xs font-bold tracking-[0.4em] uppercase mb-6 font-sans flex items-center gap-2 ${theme.accent}`}>
                                    <Star size={16} /> Curated Experiences
                                </h3>
                                <ul className="space-y-4">
                                    {(trip.experiences || "").split(',').map((exp, i) => (
                                        <li key={i} className="text-sm text-gray-600 flex items-start gap-3 font-sans">
                                            <span className={`w-1.5 h-1.5 rounded-full mt-1.5 shrink-0 ${theme.bgAccent}`} />
                                            {exp.trim()}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>

                        {/* Notion Page Content Block */}
                        {trip.pageContentHtml && (
                            <div className="mt-12 pt-12 border-t border-gray-200">
                                <span className={`text-[10px] font-bold tracking-[0.4em] uppercase mb-6 block font-sans ${theme.accent}`}>
                                    The Journey Details
                                </span>
                                
                                {/* dangerouslySetInnerHTML is React's way of rendering raw HTML strings */}
                                <div 
                                    className="notion-content-container font-sans" 
                                    dangerouslySetInnerHTML={{ __html: trip.pageContentHtml }} 
                                />
                            </div>
                        )}
                    </section>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TripPage />);
    </script>
</body>
</html>
