    <script>
        window.TRIP_DATA = {"notionPageId":"18c340b7-8f13-4468-9ebc-f258b0e8e2ea","id":"NA-12","title":"New York & Miami Signature","region":"North America","safeRegion":"north-america","category":"Urban & Coastal","duration":"9 Days","countries":"New York City & Miami","route":"NYC → Miami South Beach","experiences":"Broadway VIP access | Private yachting in Biscayne Bay | Contemporary art tours","hotels":"Aman New York | Faena Hotel","image":"https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=crop&q=80&w=1200","slug":"new-york-city-miami-na-12","pageContentHtml":"\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Cover Article\u003c/h3>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">Two icons, one perfectly choreographed escape: this 9-day itinerary moves from New York’s high-culture intensity to Miami’s sunlit coastal glamour—anchored by two of the most coveted stays in each city: Aman New York and Faena Hotel.\u003c/p>\u003cp class=\"text-gray-600 font-light leading-relaxed mb-6 text-lg\">In NYC, expect private-style access to the city’s best: curated contemporary art, architecture and design moments, and a standout evening with Broadway VIP access. Then trade the skyline for ocean air in South Beach with private yachting in Biscayne Bay, art-forward neighborhoods, and the kind of beach-luxury rhythm that feels effortless.\u003c/p>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Run of Show (9 Days)\u003c/h3>\u003ch4 class=\"text-2xl font-serif text-gray-900 mt-8 mb-3\">At-a-glance\u003c/h4>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Days 1–4 (New York City): Aman reset, art + design, Broadway VIP night, refined dining\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Days 5–9 (Miami / South Beach): Faena lifestyle, contemporary art tour, private yachting, beach + wellness, departure\u003c/li>\u003ch4 class=\"text-2xl font-serif text-gray-900 mt-8 mb-3\">Logistics snapshot\u003c/h4>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Route: NYC → Miami South Beach\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Style: Iconic hotels + private transfers + curated reservations\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Pace: City intensity first, coastal ease last\u003c/li>\u003ch3 class=\"text-3xl font-serif text-gray-900 mt-10 mb-4\">Day-by-day Details\u003c/h3>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 1 — Arrival in New York City (Aman New York reset)\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">VIP-style arrival assistance (where available) and private transfer to Aman New York\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Check-in and gentle reset: spa/thermal window and quiet luxury above the city\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Late afternoon: curated Midtown orientation (tailored)—iconic avenues with a calm pace\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Welcome dinner reservation in a refined, scene-forward setting\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 2 — NYC: Contemporary art + design (curated)\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Slow morning: breakfast at leisure\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Curated contemporary art tour (tailored): gallery/private-collection energy depending on access\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Lunch reservation in a polished setting\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Afternoon at leisure: Aman spa ritual or boutique time\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Evening: signature dining and a low-key cocktail lounge finish\u003c/li>\n                        \u003c/div>\n ansition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Private transfer to the airport and flight to Miami\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Arrival and private transfer to Faena Hotel (South Beach)\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Check-in and settle into art-forward beach glamour\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Sunset aperitif followed by a reservation-only dinner (tasteful, curated)\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 6 — Miami: Contemporary art tour + design neighborhoods\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Slow morning: beach set-up and relaxed swim\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Curated contemporary art tour (tailored): Wynwood/Design District energy with refined pacing\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Lunch reservation in a scene-led setting\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Afternoon: spa/wellness reset or pool calm\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Evening: signature dining and a low-key lounge finish\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 7 — Miami: Private yachting in Biscayne Bay\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Signature highlight: private yachting in Biscayne Bay (conditions permitting)\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Swim stops and skyline-water views with a relaxed, elevated pace\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Lunch on the water or curated dockside reservation\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Afternoon recovery: spa/wellness or quiet beach hours\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Evening: chef-led dining and restorative close\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 8 — Miami: Beach luxury + sunset ritual\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Unhurried morning: beach time and relaxed breakfast\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Optional add-on (tailored): curated tasting, boutique time, or a scenic coastal drive\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Afternoon: downtime and preparation for the final evening\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Farewell dinner: prime reservation with a celebratory tone\u003c/li>\n                        \u003c/div>\n                    \u003c/details>\n                    \u003cdetails class=\"group border border-gray-200 rounded-xl my-5 bg-white overflow-hidden shadow-sm open:shadow-md transition-all\">\n                        \u003csummary class=\"flex justify-between items-center font-serif text-lg cursor-pointer p-6 bg-gray-50/50 hover:bg-gray-50 transition-colors outline-none text-gray-900\">\n                            Day 9 — Departure (final swim + private transfer)\n                            \u003cspan class=\"transition-transform duration-300 group-open:-rotate-180 text-gray-400 group-hover:text-[#C5A059]\">\n                                \u003csvg fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" width=\"20\">\u003cpath d=\"M6 9l6 6 6-6\">\u003c/path>\u003c/svg>\n                            \u003c/span>\n                        \u003c/summary>\n                        \u003cdiv class=\"p-6 border-t border-gray-100 text-gray-600 font-sans text-sm leading-relaxed bg-white\">\n                            \u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Breakfast and a last shoreline walk\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Final spa window (if timing allows)\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">Private transfer to the airport\u003c/li>\u003cli class=\"ml-6 list-disc text-gray-600 mb-3 leading-relaxed\">End of itinerary\u003c/li>\n                        \u003c/div>\n                    \u003c/details>"};
    </script>

<body class="antialiased bg-[#FDFBF7]">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { MapPin, Star, Bed, ChevronRight, Globe } from 'https://esm.sh/lucide-react@0.292.0';

        const TripPage = () => {
            const trip = window.TRIP_DATA;
            const [scrolled, setScrolled] = useState(false);

            // Dynamic Region Styling Dictionary
            const themes = {
                "Africa": { mainBg: "bg-[#2D3E2F]", accent: "text-[#B4924A]", bgAccent: "bg-[#B4924A]", heroDrop: "drop-shadow-[0_0_15px_rgba(255,255,255,0.7)] text-[#1A3626]" },
                "Asia": { mainBg: "bg-[#2C0A0A]", accent: "text-[#AF8B58]", bgAccent: "bg-[#AF8B58]", heroDrop: "drop-shadow-lg text-[#AF8B58]" },
                "Europe": { mainBg: "bg-[#002147]", accent: "text-[#B4924A]", bgAccent: "bg-[#B4924A]", heroDrop: "drop-shadow-lg text-[#B4924A]" },
                "Latin America": { mainBg: "bg-[#002147]", accent: "text-[#C5A059]", bgAccent: "bg-[#C5A059]", heroDrop: "drop-shadow-lg text-white" },
                "Caribbean": { mainBg: "bg-[#006064]", accent: "text-[#00ced1]", bgAccent: "bg-[#00ced1]", heroDrop: "drop-shadow-lg text-white" },
                "Oceania": { mainBg: "bg-[#111111]", accent: "text-[#ea580c]", bgAccent: "bg-[#ea580c]", heroDrop: "drop-shadow-lg text-white" },
                "North America": { mainBg: "bg-[#0f172a]", accent: "text-[#C5A059]", bgAccent: "bg-[#C5A059]", heroDrop: "drop-shadow-lg text-[#C5A059]" }
            };

            // Fallback to Europe theme if region isn't explicitly matched
            const theme = themes[trip.region] || themes["Europe"]; 

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen font-serif text-[#1A1A1A]">
                    {/* Header */}
                    <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? `${theme.mainBg}/95 backdrop-blur-md shadow-xl py-4` : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <Globe className={`w-8 h-8 ${theme.accent}`} />
                                <div className="flex flex-col">
                                    <span className="text-xl font-bold tracking-tighter leading-none text-white font-sans uppercase">Global Mix</span>
                                    <span className={`text-[10px] tracking-[0.4em] font-medium font-sans uppercase ${theme.accent}`}>Travel {trip.region}</span>
                                </div>
                            </div>
                            <button className={`${theme.bgAccent} text-white px-8 py-3 text-[10px] font-bold tracking-[0.2em] font-sans hover:scale-105 transition-transform`}>
                                REQUEST ITINERARY
                            </button>
                        </div>
                    </nav>

                    {/* Hero */}
                    <section className="relative h-[80vh] flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img src={trip.image} className="w-full h-full object-cover scale-105" alt={trip.title} />
                            <div className={`absolute inset-0 bg-gradient-to-b from-${theme.mainBg.replace('bg-', '')}/80 via-transparent to-${theme.mainBg.replace('bg-', '')}/90`} />
                        </div>
                        <div className="relative z-10 text-center px-6 max-w-4xl">
                            <span className={`inline-block mb-6 tracking-[0.6em] text-xs font-bold uppercase font-sans ${theme.accent}`}>
                                Exclusive {trip.duration} Expedition
                            </span>
                            <h1 className="text-6xl md:text-8xl font-serif text-white mb-8 leading-[0.85]">
                                {trip.title.split(' ').slice(0, -1).join(' ')} <br />
                                <span className={`italic ${theme.heroDrop}`}>
                                    {trip.title.split(' ').slice(-1)}
                                </span>
                            </h1>
                        </div>
                    </section>

                    {/* Content Details */}
                    <section className="py-24 px-6 max-w-4xl mx-auto bg-white -mt-20 relative z-20 shadow-2xl rounded-t-3xl">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-16">
                            <div>
                                <h3 className={`text-xs font-bold tracking-[0.4em] uppercase mb-4 font-sans ${theme.accent}`}>The Route</h3>
                                <p className="text-xl italic text-[#1A1A1A] mb-8">{trip.route}</p>
                                
                                <h3 className={`text-xs font-bold tracking-[0.4em] uppercase mb-4 font-sans ${theme.accent}`}>Featured Accommodations</h3>
                                <p className="text-sm font-sans text-gray-600 leading-relaxed">{trip.hotels}</p>
                            </div>
                            <div>
                                <h3 className={`text-xs font-bold tracking-[0.4em] uppercase mb-6 font-sans flex items-center gap-2 ${theme.accent}`}>
                                    <Star size={16} /> Curated Experiences
                                </h3>
                                <ul className="space-y-4">
                                    {(trip.experiences || "").split(',').map((exp, i) => (
                                        <li key={i} className="text-sm text-gray-600 flex items-start gap-3 font-sans">
                                            <span className={`w-1.5 h-1.5 rounded-full mt-1.5 shrink-0 ${theme.bgAccent}`} />
                                            {exp.trim()}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>

                        {/* Notion Page Content Block */}
                        {trip.pageContentHtml && (
                            <div className="mt-12 pt-12 border-t border-gray-200">
                                <span className={`text-[10px] font-bold tracking-[0.4em] uppercase mb-6 block font-sans ${theme.accent}`}>
                                    The Journey Details
                                </span>
                                
                                {/* dangerouslySetInnerHTML is React's way of rendering raw HTML strings */}
                                <div 
                                    className="notion-content-container font-sans" 
                                    dangerouslySetInnerHTML={{ __html: trip.pageContentHtml }} 
                                />
                            </div>
                        )}
                    </section>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TripPage />);
    </script>
</body>
</html>
