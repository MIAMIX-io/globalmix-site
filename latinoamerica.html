            const [scrolled, setScrolled] = useState(false);

                e.preventDefault();
                if (trip.slug) {
                    window.location.href = `https://${trip.slug}`;
                } else {
                    const safeSlug = trip.title.toLowerCase().replace(/[^a-z0-9]+/g, '-'); 
                    window.location.href = `/travel/latin-america/${safeSlug}`;
                }
            };

            const expeditions = [
    { id: 1, title: "White Continent Expedition", location: "Antarctica, Buenos Aires & Ushuaia", slug: "globalmix.network/travel/latin-america/antarctica-buenos-aires-ushuaia-la-01", description: "The White Continent Expedition represents one of the most extraordinary journeys on the planet. The itinerary begins in the vibrant Argentine capital, Buenos Aires, where European elegance meets Latin American passion.", image: "https://images.unsplash.com/photo-1551415923-31d2072bc248?q=80&w=2064&auto=format&fit=crop&fm=webp", category: "polar" },
    { id: 2, title: "Patagonia Grand Wilderness", location: "Argentine Patagonia", slug: "globalmix.network/travel/latin-america/argentine-patagonia-la-02", description: "Explore some of the most impressive landscapes in the Southern Hemisphere. The journey begins in Ushuaia, continues to El Calafate to visit the spectacular Perito Moreno Glacier, and moves to Peninsula Valdes for whale watching.", image: "https://plus.unsplash.com/premium_photo-1694475710456-682ba042cb7b?q=80&w=1548&auto=format&fit=crop&fm=webp", category: "nature" },
    { id: 3, title: "Fjords & Torres del Paine", location: "Chilean Patagonia", slug: "globalmix.network/travel/latin-america/chilean-patagonia-la-03", description: "A unique exploration of Patagonia from both sea and land. The journey begins by sailing through the majestic Chilean Fjords—a landscape of glaciers and mountains accessible only by water.", image: "https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&q=80&w=1200&fm=webp", category: "adventure" },

                            <div className="flex justify-center">

                                    Explore Collection
                                </a>

                        <a href="#about-us" className="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce cursor-pointer hover:opacity-75 transition-opacity z-10">
                            <ChevronDown size={32} className="text-white/70" />

                                    <li className="flex items-center gap-4"><MapPin className="w-5 h-5 text-peach shrink-0" /><span>Buenos Aires, Argentina</span></li>

                    </footer>

                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
