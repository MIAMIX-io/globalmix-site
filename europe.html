<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Mix - Travel Europe</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 2s ease-out',
                        'bounce': 'bounce 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        bounce: {
                            '0%, 100%': { transform: 'translateY(-25%)', animationTimingFunction: 'cubic-bezier(0.8,0,1,1)' },
                            '50%': { transform: 'translateY(0)', animationTimingFunction: 'cubic-bezier(0,0,0.2,1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F9F7F2] antialiased">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        import { 
          Compass, MapPin, Ship, TowerControl as Tower, 
          Mountain, Utensils, Castle, 
          Menu, X, ChevronRight, Mail, Phone, Globe, 
          Clock, Bed, Star, Camera, ChevronDown
        } from 'https://esm.sh/lucide-react@0.292.0';

        const App = () => {
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [scrolled, setScrolled] = useState(false);
          const [activeCategory, setActiveCategory] = useState('All');

          const navLinks = [
            { name: 'Itineraries', href: '#itineraries' },
            { name: 'Experiences', href: '#experiences' },
            { name: 'About', href: '#about' }
          ];

          useEffect(() => {
            const handleScroll = () => {
              setScrolled(window.scrollY > 50);
            };
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          const handleTripAction = (e, trip, regionName) => {
              e.preventDefault();
              const email = "info@globalmix.online";
              const subject = encodeURIComponent(`Requesting Full Itinerary: ${trip.title}`);
              const body = encodeURIComponent(`Hello Global Mix VIP Team,\n\nPlease send me the full itinerary and details for the "${trip.title}" expedition.\n\nThank you!`);
              const mailtoLink = `mailto:${email}?subject=${subject}&body=${body}`;

              const safeRegion = regionName.toLowerCase().replace(/[^a-z0-9]/g, '');
              const safeSlug = trip.title.split(' ')[0].toLowerCase().replace(/[^a-z0-9-]/g, ''); 
              const pageUrl = `/${safeRegion}/${safeSlug}`;

              window.location.href = mailtoLink;
              setTimeout(() => { window.location.href = pageUrl; }, 300);
          };

          const europeanJourneys = [
            { id: 1, title: "French Riviera & Italian Riviera", duration: "8 Days", countries: "France – Italy", route: "Nice → Monaco → Portofino → Florence", experiences: ["Private Yacht along the French Riviera", "Michelin-starred dining in Monaco", "Private shopping experience in Florence", "Helicopter transfers between destinations"], hotels: ["Hotel de Paris Monte‑Carlo", "Belmond Splendido Portofino", "Four Seasons Hotel Firenze"], image: "https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&q=80&w=1200", category: "Mediterranean" },
            { id: 2, title: "Châteaux & Champagne", duration: "7 Days", countries: "France", route: "Paris → Loire Valley → Reims", experiences: ["Private tour of Loire Valley castles", "VIP tastings at legendary Champagne houses", "Private dinner in a historic château"], hotels: ["Le Meurice Paris", "Les Sources de Cheverny"], image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&q=80&w=1200", category: "Classic" },
            { id: 3, title: "High-End Classic Italy", duration: "10 Days", countries: "Italy", route: "Rome → Florence → Venice → Lake Como", experiences: ["After-hours private visit to the Vatican", "Gondola ride with a private violinist", "Private villa stay at Lake Como"], hotels: ["Hotel de Russie Rome", "Aman Venice", "Grand Hotel Tremezzo"], image: "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?auto=format&fit=crop&q=80&w=1200", category: "Classic" },
            { id: 4, title: "Exclusive Swiss Alps", duration: "7 Days", countries: "Switzerland", route: "Zurich → St. Moritz → Zermatt", experiences: ["Glacier Express panoramic train journey", "Heliskiing in the high Alps", "Private Alpine spa and wellness"], hotels: ["Badrutt’s Palace Hotel", "The Omnia Zermatt"], image: "https://images.unsplash.com/photo-1502943693086-33b5b1cfdf2f?auto=format&fit=crop&q=80&w=1200", category: "Nature" },
            { id: 5, title: "Greece & the Aegean Islands", duration: "9 Days", countries: "Greece", route: "Athens → Mykonos → Santorini", experiences: ["Private yacht island-hopping", "Dinner overlooking the volcanic caldera", "Archaeological tour with a lead historian"], hotels: ["Amanzoe", "Cavo Tagoo Mykonos"], image: "https://images.unsplash.com/photo-1503152394-c571994fd383?auto=format&fit=crop&q=80&w=1200", category: "Mediterranean" },
            { id: 6, title: "Scotland: Castles & Highlands", duration: "8 Days", countries: "Scotland", route: "Edinburgh → Scottish Highlands → Inverness", experiences: ["Private castle accommodations", "Exclusive rare whisky tastings", "Highlands photographic safari"], hotels: ["The Balmoral Hotel Edinburgh", "Inverlochy Castle Hotel"], image: "https://images.unsplash.com/photo-1533154683836-84ea7a0bc310?auto=format&fit=crop&q=80&w=1200", category: "Nature" },
            { id: 7, title: "Gourmet & Cultural Spain", duration: "9 Days", countries: "Spain", route: "Madrid → San Sebastian → Barcelona", experiences: ["Tapas tour led by a master chef", "Dining at Michelin houses in San Sebastián", "Private Gaudí architectural exploration"], hotels: ["Mandarin Oriental Ritz Madrid", "Hotel Maria Cristina San Sebastian"], image: "https://images.unsplash.com/photo-1574556462575-eb106a5865a0?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", category: "Classic" },
            { id: 8, title: "Norwegian Fjords", duration: "7 Days", countries: "Norway", route: "Oslo → Bergen → Norwegian Fjords", experiences: ["Boutique fjord cruise", "Helicopter flight over massive glaciers", "Luxury Scandinavian lodge stay"], hotels: ["The Thief Oslo"], image: "https://images.unsplash.com/photo-1723390351482-21253e158c4d?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D", category: "Nature" },
            { id: 9, title: "Imperial Central Europe", duration: "8 Days", countries: "Austria – Czech Rep. – Hungary", route: "Vienna → Salzburg → Prague → Budapest", experiences: ["Private classical music concert", "Dinner in an Imperial Palace", "Private Danube River cruise"], hotels: ["Hotel Sacher Vienna", "Four Seasons Hotel Prague"], image: "https://images.unsplash.com/photo-1517330357046-3ab5a5dd42a1?auto=format&fit=crop&q=80&w=1200", category: "Classic" },
            { id: 10, title: "Elegant Portugal", duration: "7 Days", countries: "Portugal", route: "Lisbon → Sintra → Douro Valley → Porto", experiences: ["Private palace tour in Sintra", "Exclusive vineyard visit in Douro", "Traditional Rabelo boat private cruise"], hotels: ["Six Senses Douro Valley", "The Yeatman Porto"], image: "https://images.unsplash.com/photo-1555881400-74d7acaacd8b?auto=format&fit=crop&q=80&w=1200", category: "Classic" }
          ];

          const categories = ["All", "Classic", "Mediterranean", "Nature"];

          return (
            <div className="min-h-screen bg-[#F9F7F2] text-[#1A1A1A] font-serif selection:bg-[#B4924A] selection:text-white">
              {/* Navigation */}
              <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? 'bg-[#002147]/95 backdrop-blur-md shadow-xl py-4' : 'bg-transparent py-8'}`}>
                <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <Globe className="w-8 h-8 text-[#B4924A]" />
                    <div className="flex flex-col">
                      <span className="text-xl font-bold tracking-tighter leading-none text-white font-sans uppercase">Global Mix</span>
                      <span className="text-[10px] tracking-[0.4em] font-medium text-[#B4924A] font-sans">Travel Europe</span>
                    </div>
                  </div>

                  <div className="hidden md:flex items-center gap-10">
                    {navLinks.map((item) => (
                      <a key={item.name} href={item.href} className="text-[10px] font-bold tracking-[0.3em] uppercase text-white hover:text-[#B4924A] transition-colors font-sans">{item.name}</a>
                    ))}
                    <a href="#contact" className="bg-[#B4924A] text-white px-8 py-3 rounded-sm text-[10px] font-bold tracking-[0.2em] hover:bg-white hover:text-[#002147] transition-all transform hover:scale-105 font-sans inline-block">
                      INQUIRE NOW
                    </a>
                  </div>

                  <button className="md:hidden text-white" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                    {isMenuOpen ? <X size={24} /> : <Menu size={24} />}
                  </button>
                </div>

                {/* Mobile Menu */}
                {isMenuOpen && (
                  <div className="absolute top-full left-0 w-full bg-[#002147] border-t border-white/10 p-8 flex flex-col gap-6 md:hidden animate-in slide-in-from-top">
                    {navLinks.map((item) => (
                      <a key={item.name} href={item.href} onClick={() => setIsMenuOpen(false)} className="text-white text-sm font-bold tracking-widest uppercase font-sans">{item.name}</a>
                    ))}
                    <a href="#contact" onClick={() => setIsMenuOpen(false)} className="bg-[#B4924A] text-white py-4 font-bold tracking-widest uppercase font-sans text-center inline-block">Request Itinerary</a>
                  </div>
                )}
              </nav>

              {/* Hero Section */}
              <section className="relative h-[95vh] flex items-center justify-center overflow-hidden">
                <div className="absolute inset-0 z-0">
                  <img src="https://images.unsplash.com/photo-1467269204594-9661b134dd2b?auto=format&fit=crop&q=80&w=1920&fm=webp" className="w-full h-full object-cover scale-105" alt="European Architecture" fetchpriority="high" />
                  <div className="absolute inset-0 bg-gradient-to-b from-[#002147]/95 via-[#002147]/60 to-[#002147]/100" />
                </div>

                <div className="relative z-10 text-center px-6 max-w-5xl">
                  <span className="inline-block mb-6 text-[#B4924A] tracking-[0.6em] text-xs font-bold uppercase animate-fade-in font-sans">
                    THE HERITAGE OF EUROPEAN LUXURY
                  </span>
                  <h1 className="text-6xl md:text-9xl font-serif text-white mb-8 leading-[0.85]">
                    Grand Journeys <br />
                    <span className="italic text-[#B4924A] drop-shadow-[0_0_15px_rgba(255,255,255,0.7)]">
                        of Europe
                    </span>
                  </h1>
                  <p className="text-lg md:text-xl text-white/80 max-w-2xl mx-auto leading-relaxed mb-12 font-light font-sans">
                    A masterwork collection of journeys capturing the imperial essence, coastal elegance, and sublime landscapes of the Old Continent.
                  </p>
                  <div className="flex flex-col sm:flex-row gap-6 justify-center">
                    <a href="#itineraries" className="bg-[#B4924A] text-white px-12 py-5 font-bold text-xs tracking-[0.3em] uppercase hover:bg-white hover:text-[#002147] transition-all shadow-2xl font-sans inline-block">
                      Explore Collection
                    </a>
                  </div>
                </div>

                <a href="#about" className="absolute bottom-10 left-1/2 -translate-x-1/2 text-white/50 flex flex-col items-center gap-2 hover:text-white transition-colors cursor-pointer group">
                  <span className="text-[10px] tracking-[0.3em] uppercase font-sans">Scroll</span>
                  <ChevronDown size={20} className="animate-bounce" />
                </a>
              </section>

              {/* Intro Section */}
              <section id="about" className="py-32 px-6 bg-white border-b border-black/5 scroll-mt-20">
                <div className="max-w-4xl mx-auto text-center">
                  <div className="w-20 h-[1px] bg-[#B4924A] mx-auto mb-10" />
                  <h2 className="text-4xl md:text-5xl mb-8 text-[#002147] leading-tight italic">"Where history meets exclusivity."</h2>
                  <p className="text-gray-500 font-sans leading-relaxed text-lg max-w-2xl mx-auto">
                    From the golden palaces of Vienna to the pristine fjords of Norway, GLOBAL MIX redefines high-end European travel, combining privileged access with incomparable concierge services.
                  </p>
                </div>
              </section>

              {/* Journeys Collection */}
              <section id="itineraries" className="pt-20 pb-10 bg-[#F9F7F2] scroll-mt-24">
                <div className="max-w-7xl mx-auto px-6">
                  <div className="flex flex-col md:flex-row justify-between items-end gap-8 mb-16">
                    <div className="max-w-xl">
                      <h3 className="text-xs font-bold tracking-[0.4em] text-[#B4924A] uppercase mb-4 font-sans">2025 / 2026 Collection</h3>
                      <h4 className="text-4xl md:text-5xl text-[#002147] leading-none">Our Imperial Selection</h4>
                    </div>
                    <div className="flex gap-4 overflow-x-auto pb-4 w-full md:w-auto scrollbar-hide">
                      {categories.map(cat => (
                        <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-6 py-2 text-[10px] font-bold tracking-widest uppercase transition-all whitespace-nowrap font-sans border ${activeCategory === cat ? 'bg-[#002147] text-white border-[#002147]' : 'bg-transparent text-gray-400 border-black/10 hover:border-[#B4924A]'}`}>
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Grid */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                    {europeanJourneys.filter(j => activeCategory === 'All' || j.category === activeCategory).map((journey) => (
                      <div key={journey.id} className="group flex flex-col h-full bg-white border border-black/5 hover:border-[#B4924A]/30 transition-all duration-500 shadow-sm hover:shadow-2xl">
                        <div className="relative h-80 overflow-hidden">
                          {/* Lazy Load & WebP */}
                          <img src={`${journey.image}&fm=webp&q=60&w=800`} alt={journey.title} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110 grayscale-[30%] group-hover:grayscale-0" loading="lazy" />
                          <div className="absolute top-6 left-6 flex flex-col gap-2">
                            <span className="bg-[#B4924A] text-white px-3 py-1 text-[10px] font-bold tracking-widest uppercase font-sans">{journey.duration}</span>
                          </div>
                          <div className="absolute bottom-0 left-0 w-full p-8 bg-gradient-to-t from-[#002147] to-transparent">
                            <div className="flex items-center gap-2 text-[#B4924A] mb-2"><MapPin size={14} /><span className="text-[10px] font-bold tracking-widest uppercase font-sans">{journey.countries}</span></div>
                            <h5 className="text-2xl text-white leading-tight">{journey.title}</h5>
                          </div>
                        </div>

                        <div className="p-8 flex flex-col flex-grow">
                          <div className="mb-6"><p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3 font-sans">Selected Route</p><p className="text-sm text-[#002147] italic font-medium">{journey.route}</p></div>
                          <div className="space-y-4 mb-8">
                            <p className="text-[10px] font-bold text-[#B4924A] uppercase tracking-widest font-sans flex items-center gap-2"><Star size={12} fill="currentColor" /> Luxe Experiences</p>
                            <ul className="grid grid-cols-1 gap-2">
                              {journey.experiences.map((exp, i) => (
                                <li key={i} className="text-xs text-gray-500 flex items-start gap-2 leading-snug font-sans"><span className="w-1 h-1 bg-[#B4924A] rounded-full mt-1.5 shrink-0" />{exp}</li>
                              ))}
                            </ul>
                          </div>

                          <div className="mt-auto pt-6 border-t border-black/5">
                            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3 font-sans flex items-center gap-2"><Bed size={12} /> Suggested Hotels</p>
                            <div className="flex flex-wrap gap-2">
                              {journey.hotels.map((h, i) => (<span key={i} className="text-[9px] font-bold text-[#002147] bg-[#F9F7F2] px-2 py-1 uppercase tracking-tighter">{h}</span>))}
                            </div>
                          </div>

                          <button onClick={(e) => handleTripAction(e, journey, "Europe")} className="mt-8 group-hover:bg-[#002147] group-hover:text-white border border-[#002147] text-[#002147] py-4 px-6 text-[10px] font-bold tracking-[0.3em] uppercase transition-all flex items-center justify-between font-sans text-center w-full">
                            Request Itinerary <ChevronRight size={14} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {/* Elite Privileges */}
              <section id="experiences" className="py-32 bg-[#002147] text-white overflow-hidden scroll-mt-20">
                <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                  <div className="relative">
                    <div className="aspect-[4/5] overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1549144511-f099e773c147?auto=format&fit=crop&q=80&w=1200&fm=webp" className="w-full h-full object-cover grayscale opacity-50" alt="Concierge Service" loading="lazy" />
                    </div>
                    <div className="absolute -bottom-10 -right-10 bg-[#B4924A] p-12 hidden md:block"><p className="text-4xl italic leading-tight">Elite <br />Concierge <br />24/7</p></div>
                  </div>
                  <div>
                    <h3 className="text-xs font-bold tracking-[0.5em] text-[#B4924A] uppercase mb-8 font-sans">BEYOND CONVENTIONAL</h3>
                    <h4 className="text-5xl md:text-6xl mb-10 leading-none">The Luxury of No Limits.</h4>
                    <div className="space-y-12">
                      <div className="flex gap-6">
                        <div className="shrink-0 w-12 h-12 rounded-full border border-[#B4924A] flex items-center justify-center text-[#B4924A]"><Compass size={24} /></div>
                        <div><h5 className="text-xl mb-3">Behind-the-Scenes Access</h5><p className="text-gray-400 font-sans text-sm">From museums closed to the public to private villas of European aristocracy.</p></div>
                      </div>
                      <div className="flex gap-6">
                        <div className="shrink-0 w-12 h-12 rounded-full border border-[#B4924A] flex items-center justify-center text-[#B4924A]"><Ship size={24} /></div>
                        <div><h5 className="text-xl mb-3">Ultra-Luxury Fleet</h5><p className="text-gray-400 font-sans text-sm">Transfers via private jets, helicopters, and next-generation yachts across the continent.</p></div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              {/* Footer */}
              <footer id="contact" className="bg-[#051324] text-white pt-24 pb-12 border-t border-white/5 scroll-mt-20">
                <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-4 gap-16 mb-20">
                  <div className="md:col-span-2">
                    <div className="flex items-center gap-3 mb-8">
                      <Globe className="w-8 h-8 text-[#B4924A]" />
                      <div className="flex flex-col"><span className="text-xl font-bold tracking-tighter leading-none text-white font-sans uppercase">Global Mix</span><span className="text-[10px] tracking-[0.4em] font-medium text-[#B4924A] font-sans">Travel Europe</span></div>
                    </div>
                    <p className="text-gray-500 font-sans text-sm max-w-sm leading-relaxed mb-10">Specialists in ultra-luxury journeys through Europe and the world. Designing unique experiences for the most demanding global traveler for over a decade.</p>
                  </div>
                  <div>
                    <h6 className="text-[10px] font-bold tracking-[0.4em] uppercase text-[#B4924A] mb-8 font-sans">Explore</h6>
                    <ul className="space-y-4 font-sans text-sm text-gray-400">
                      <li><a href="#itineraries" className="hover:text-white cursor-pointer transition-colors">Classic Collection</a></li>
                      <li><a href="#itineraries" className="hover:text-white cursor-pointer transition-colors">Mediterranean Luxury</a></li>
                      <li><a href="#itineraries" className="hover:text-white cursor-pointer transition-colors">Alpine Expeditions</a></li>
                      <li><a href="#experiences" className="hover:text-white cursor-pointer transition-colors">Private Jets</a></li>
                    </ul>
                  </div>
                  <div>
                    <h6 className="text-[10px] font-bold tracking-[0.4em] uppercase text-[#B4924A] mb-8 font-sans">Contact</h6>
                    <ul className="space-y-6 font-sans text-sm text-gray-400">
                      <li className="flex gap-4"><Phone size={16} className="text-[#B4924A]" /><a href="tel:+1 786 459 8797" className="hover:text-white">+34 91 123 4567</a></li>
                      <li className="flex gap-4"><Mail size={16} className="text-[#B4924A]" /><a href="mailto:infop@globalmix.online" className="hover:text-white">vip@globalmix.travel</a></li>
                      <li className="flex gap-4"><MapPin size={16} className="text-[#B4924A]" /><span>Madrid | Paris | London</span></li>
                    </ul>
                  </div>
                </div>
                <div className="max-w-7xl mx-auto px-6 pt-12 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-6 text-[10px] text-gray-600 font-sans tracking-[0.2em] uppercase">
                  <p>© 2024 GLOBAL MIX TRAVEL EUROPE. ALL RIGHTS RESERVED.</p>
                  <div className="flex gap-8"><span className="hover:text-white cursor-pointer transition-colors">Privacy Policy</span><span className="hover:text-white cursor-pointer transition-colors">Terms of Service</span></div>
                </div>
              </footer>
            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
